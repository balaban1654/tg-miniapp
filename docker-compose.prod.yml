services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hunter
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  server:
    build: ./server
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://hunter:${DB_PASSWORD}@db:5432/hunter
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
