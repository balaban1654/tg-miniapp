<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0817">
<title>Hunter AI</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:'Montserrat';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Regular.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Medium.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-SemiBold.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Bold.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-ExtraBold.woff2') format('woff2')}
:root{--bg:#0d0817;--bg2:#150d26;--card:#1c1233;--card2:#251847;--line:#34255c;--fg:#f1ebff;--mut:#a89cc8;--acc:#9b5cff;--acc2:#c9a6ff;--acc3:#6a2fe0;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b8a;
--fd:'Montserrat',system-ui,sans-serif;--fb:'Montserrat',system-ui,sans-serif;--fm:'Montserrat',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* Полосу прокрутки не показываем, листать экран можно как обычно */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
body{font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#1a0f33,#0d0817 45%) fixed,var(--bg);color:var(--fg);font:14px/1.5 var(--fb);overscroll-behavior:none}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.25}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#root{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hd{position:sticky;top:0;z-index:5;background:#0d0817ee;backdrop-filter:blur(8px);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;gap:8px;align-items:center;font:700 15px var(--fd)}
.logo{width:34px;height:34px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font:700 12px var(--fd);overflow:hidden;flex:none;border:1.5px solid var(--acc)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.bname{display:grid;gap:2px;line-height:1.1;min-width:0}
.hd.sig .clk{font-size:18px;margin-left:10px}
.hd.sig .pillb{padding:8px 9px}
.bname b .clk{font:600 12px var(--fd);color:var(--mut);margin-left:8px;font-variant-numeric:tabular-nums}
.bname b{font:700 15px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onl2{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ok)}
.onl2 i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hr{display:flex;gap:8px;align-items:center}
.ava.lg{width:58px;height:58px;font-size:20px}
.ava img,.avb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pillb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--mut);cursor:pointer}
.avb{overflow:hidden;width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);background:var(--card2);color:var(--acc2);font:700 12px var(--fd);cursor:pointer;display:grid;place-items:center;padding:0}
main{flex:1;padding:6px 16px 96px;display:grid;gap:12px;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.hero{border-color:var(--acc);display:grid;gap:10px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2a1857dd,var(--card) 70%)}
.card.hero>*{position:relative}
.hero-art{margin:-14px -14px 0;display:block;width:calc(100% + 28px);max-width:none;height:auto}

/* Живой график главной карточки рисуется скриптом (heroArt): свечи идут справа налево, линия-сканер иногда подсвечивает пару свечей */

/* Полноэкранный учебный терминал (урок 1) */
.fs-hd{gap:6px}.fs-hd .brand b{font:700 15px var(--fd)}
.xbtn{background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
.steppill{border:1px solid var(--acc);color:var(--acc2);border-radius:99px;padding:6px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.fs-main{flex:1;padding:6px 16px 28px;display:grid;gap:14px;align-content:start}
.fs-bottom{padding:14px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.fs-tip{font:700 15px/1.4 var(--fd)}
.ptabs{display:flex;gap:8px}.ptabs button{flex:1;border:0;border-radius:12px;padding:11px 6px;background:var(--card);color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
.ptabs button.on{background:var(--acc);color:#fff}.ptabs button:disabled{opacity:.7}
.prow{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;background:var(--card);padding:18px 16px;color:var(--fg);font:700 15px var(--fd);cursor:pointer;text-align:left}
.prow:active{transform:scale(.99);background:var(--card2)}
.pay{background:#3ddc9722;color:var(--ok);border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700}
.note{color:var(--mut);font-size:12.5px;line-height:1.5}
.sig{border:1px solid var(--acc);border-radius:20px;padding:16px;background:var(--card);display:grid;gap:2px}
.sig h3{font-size:20px;margin-bottom:6px}
.sig .r{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.sig .r:last-of-type{border-bottom:0}
.sig .btn.r{display:block;justify-content:normal;padding:13px;border-bottom:0}   /* класс r у кнопки «Минус» не должен подхватывать строки карточки */
.sig .r span{color:var(--mut)}.sig .r b{text-align:right}
.term{display:grid;gap:12px;position:relative}
.trow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chip{background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.dots{background:var(--card);border:0;border-radius:12px;width:46px;height:40px;font-size:18px;font-weight:700;color:var(--fg);cursor:pointer;letter-spacing:1px}
.bal{text-align:right;font-size:11px;color:var(--mut)}.bal b{display:block;font:700 18px var(--fd);color:var(--fg)}
.cv{position:relative;background:#120a24;border-radius:14px;overflow:hidden}
.cv svg{display:block;width:100%;height:auto}
.ttag{position:absolute;right:8px;bottom:8px;background:#ffffff1c;border-radius:6px;padding:2px 7px;font:700 12px var(--fm)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{background:var(--card);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;font:600 15px var(--fm)}
.fld label{display:block;font:500 11px var(--fb);color:var(--mut);margin-bottom:4px}
.fld button{width:30px;height:30px;border-radius:8px;border:0;background:var(--card2);font-weight:800;font-size:16px;color:var(--fg)}
.pl{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;align-items:center}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tb button{border:0;border-radius:14px;padding:16px;font:700 16px var(--fd);color:#fff;cursor:pointer}
.buy{background:#1f8f4e}.sell{background:#c23b4f}
.off{opacity:.38;pointer-events:none;filter:saturate(.7)}
.tg{position:relative;outline:2px solid var(--ok);outline-offset:2px;border-radius:14px;animation:tgp 1.4s ease-in-out infinite}
.tg::before{content:attr(data-n);position:absolute;top:-10px;left:-8px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#06210f;font:800 11px/20px var(--fd);text-align:center;z-index:3}
@keyframes tgp{50%{outline-color:#3ddc9755}}
.hint{position:absolute;z-index:6;background:#16322a;border:1px solid var(--ok);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;max-width:230px;box-shadow:0 8px 24px #0008}
.pop{position:absolute;z-index:5;left:0;right:0;top:46px;background:#1b1233;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:0 14px 40px #000a}
.pop h4{margin:2px 0 0;font:600 12.5px var(--fb);color:var(--mut)}
.srow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:14px;font:700 14px var(--fd);border:0;width:100%;color:var(--fg);cursor:pointer}
.sw{width:46px;height:26px;border-radius:99px;background:#ffffff26;position:relative;transition:.2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.opts{display:grid;gap:8px}.opts.c4{grid-template-columns:repeat(4,1fr)}.opts.c5{grid-template-columns:repeat(5,1fr)}
.opt{border:0;border-radius:11px;background:var(--card);padding:12px 4px;font:700 13px var(--fd);color:var(--fg);cursor:pointer}
.opt.on{background:#4b2f8f}
.live{position:absolute;left:10px;bottom:10px;background:#0d0817dd;border:1.5px solid var(--ok);border-radius:12px;padding:8px 18px;font:800 20px var(--fd)}
.cd{position:absolute;z-index:6;left:10px;top:52px;display:grid;justify-items:center;gap:4px;text-align:center;background:#16322aee;border:1px solid var(--ok);border-radius:12px;padding:8px 10px;box-shadow:0 8px 28px #000a;pointer-events:none}
.cdc{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ok);display:grid;place-items:center}
.fld button{transition:transform .08s,background .15s}.fld button:active{transform:scale(.84);background:var(--acc)}
.val{display:inline-block}.bump{animation:bump .38s ease-out}
@keyframes bump{40%{transform:scale(1.14);color:var(--ok)}}
.ck{background:var(--card);border-radius:16px;overflow:hidden}.ck .i{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}.ck .i:last-child{border-bottom:0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--acc2);animation:rot .8s linear infinite;flex:none}
.tick{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#06210f;display:grid;place-items:center;font-weight:800;flex:none;animation:bump .4s ease-out}
@keyframes rot{to{transform:rotate(360deg)}}
.rise{animation:riseIn .5s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}}
.fin{border:1px solid var(--ok);background:#12301f;border-radius:18px;padding:16px;display:grid;gap:10px}
.pshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 14px}
.pshead b{font:700 16px var(--fd);white-space:nowrap}
.pshead span{font-size:11px;text-align:right}
.pslist{background:var(--card);border-radius:18px;overflow:hidden}
.ps{overflow:hidden;transition:height .45s cubic-bezier(.2,.8,.2,1),opacity .45s ease}.ps-in{padding:14px 16px;display:grid;gap:8px}.ps+.ps{border-top:1px solid #ffffff10}
.pbadge{border:1px solid;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pbadge.w{color:var(--ok);border-color:var(--ok);background:#3ddc9712}.pbadge.l{color:var(--bad);border-color:var(--bad);background:#ff6b8a12}.pbadge.n{color:var(--mut);border-color:var(--line)}
.since{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:18px}.since svg{width:17px;height:17px;flex:none;display:block;transform:translateY(2.1px)}
.ic svg{width:44px;height:44px;color:var(--acc2)}
.card.grad{background:linear-gradient(135deg,var(--acc3),#3a1c8a);border:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm{font-size:12px;color:var(--mut)} .mut{color:var(--mut)} .mono{font-family:var(--fm)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stats>*{min-width:0}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--card);border:0;border-radius:16px;padding:12px 8px 12px 14px}
.stat span{font-size:11px}
.stat b{display:block;font:700 20px var(--fm)}
.btn{display:block;width:100%;text-align:center;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.98)}.btn.o{background:none;border:1px solid var(--acc);color:var(--acc2)}.btn:disabled{opacity:.45}
.btn.g{background:var(--ok);color:#06210f}.btn.r{background:var(--bad);color:#2b0610}
.btn.sm2{padding:8px;font-size:12px;border-radius:10px}
.tl{display:flex;gap:8px;align-items:center;min-width:0}
.tl>div:not(.ava){min-width:0;flex:1}
.tl>.ava{width:40px;height:40px;flex:none}
.tl b{font-size:14px}
.card.tr{padding:12px}
.tl.lk{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:12px;transition:transform .08s}
.tl.lk:active{transform:scale(.98)}
.tl .un{display:block;margin-top:2px;font-size:11.5px;white-space:nowrap;color:var(--acc2);transition:color .15s,text-shadow .15s}
.tl.lk:hover .un,.tl.lk:active .un,.tl.lk:focus-visible .un{color:#fff;text-shadow:0 0 10px #9b5cffcc}
.tr .btn.o,.lesson{transition:background .15s,color .15s,box-shadow .15s}
.tr .btn.o:active{background:var(--card2);border-color:var(--acc)}
@media(hover:hover){.tr .btn.o:hover{background:var(--card2);border-color:var(--acc)}}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;font-size:12px;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rq{color:var(--fg);font-weight:600;font-size:14px}
.rrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtn{border:1.5px solid var(--acc);background:transparent;color:var(--acc2);border-radius:14px;padding:14px 6px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s,color .15s,transform .1s,box-shadow .15s}
@media(hover:hover){.rbtn:hover{background:var(--acc);color:#fff;box-shadow:0 0 0 3px #9b5cff33}}
.rbtn:active,.rbtn:focus-visible{background:var(--acc);color:#fff;outline:none}
.rbtn:active{transform:scale(.97)}
.rbtn .rsub{display:block;margin-top:3px;font-size:11px;font-weight:500;opacity:.75;line-height:1.2}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0b0616;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px;cursor:pointer}
.tabs button.on{color:var(--acc2);font-weight:700} .tabs svg{width:24px;height:24px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font:600 11px var(--fm)}
.p-ok{background:#3ddc9722;color:var(--ok)}.p-bad{background:#ff6b8a22;color:var(--bad)}.p-pur{background:#9b5cff33;color:var(--acc2)}.p-warn{background:#ffb84d22;color:var(--warn)}
.bars{display:flex;gap:6px;align-items:flex-end;height:80px}
.bars div{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start}
.bars i{display:block;border-radius:3px}.bars i.has{min-height:3px}
.bars .w{background:var(--ok)}.bars .l{background:var(--bad)}
.days{display:flex;gap:6px;color:var(--mut);font-size:10px}.days span{flex:1;text-align:center}
.ava{overflow:hidden;width:48px;height:48px;border-radius:50%;border:2px solid var(--acc);background:var(--card2);color:var(--acc2);font:700 18px var(--fd);display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:26px 10px;display:grid;gap:8px;justify-items:center}

.ext{display:grid;place-items:center;color:var(--mut,#9d8fc4);flex:none}
.lesson{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;color:inherit}
.lesson:active{background:var(--card2);border-color:var(--acc)}
@media(hover:hover){.lesson:hover{background:var(--card2);border-color:var(--acc)}}
.num{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font:700 14px var(--fm);flex:none;color:var(--acc2)}
.num.done{background:var(--ok);color:#06210f}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tr{display:grid;gap:8px}
.back{background:none;border:0;color:var(--acc2);padding:4px 0;cursor:pointer;font-size:13px;text-align:left}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(37,24,71,.96);border:1px solid var(--acc);box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 24px rgba(155,92,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:9px 26px;border-radius:14px;z-index:99;width:max-content;max-width:92%;text-align:center;font-weight:600;line-height:1.35;pointer-events:none;animation:toastIn .18s ease-out,toastOut .7s ease-in 1.3s forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes toastOut{0%{opacity:1}40%{opacity:.6}100%{opacity:0}}
svg{max-width:100%}
.err{color:var(--bad)}
@media(max-width:350px){.stat{padding:8px 6px}.stat b{font-size:17px}.stat span{font-size:10px}main{padding-inline:12px}.hd{padding-inline:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="root"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
try{tg&&tg.ready();tg&&tg.expand();tg&&tg.setHeaderColor&&tg.setHeaderColor('#0d0817');tg&&tg.setBackgroundColor&&tg.setBackgroundColor('#0d0817')}catch{}
const $=s=>document.querySelector(s);
const root=$('#root');
let me=null,tab='home',region=null,timers=[];

function el(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v)}
  for(const k of kids.flat(Infinity))if(k!==null&&k!==undefined&&k!==false)e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
const svgEl=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const money=v=>'$'+Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const dmy=v=>new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}).replace(/\s*г\.?$/,'');
const hm=v=>new Date(v).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

// Часы сервера: поправка берётся из ответа с самой короткой задержкой (середина запроса), чтобы таймер и часы не плавали
const SRV={skew:0,rtt:Infinity,at:0};
const nowMs=()=>Date.now()+SRV.skew;
function syncClock(iso,t0,t1){

/**
 * Декоративный «живой» график: последняя свеча тикает, каждые несколько секунд появляется новая, всё едет влево.
 * Линия-сканер проходит слева направо и ненадолго подсвечивает пару свечей, потом они гаснут до следующего прохода.
 * Это иллюстрация, а не анализ: цены случайные, сигналов и цифр здесь нет.

function heroArt(){
  const NSV='http://www.w3.org/2000/svg';
  const W=380,DX=30,BW=21,LIVE_X=322,TOP=14,BOT=104,T=4.2,TICK=.12,CYCLE=6.4,SWEEP=3.6;

<defs>
<linearGradient id="trail" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9b5cff" stop-opacity="0"/><stop offset="1" stop-color="#9b5cff" stop-opacity=".26"/></linearGradient>
<linearGradient id="fog" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1c1233" stop-opacity="0"/><stop offset="1" stop-color="#1c1233" stop-opacity=".85"/></linearGradient>
</defs>
<path d="M0,128 L0,88 L26,78 L44,86 L74,54 L98,72 L128,40 L156,64 L190,48 L224,76 L262,58 L296,80 L330,64 L380,84 L380,128Z" fill="#3a2d6e" fill-opacity=".34"/><path d="M0,128 L0,102 L40,92 L70,100 L112,80 L150,94 L196,84 L240,100 L286,88 L330,100 L380,92 L380,128Z" fill="#2a2152" fill-opacity=".5"/><rect x="0" y="70" width="380" height="58" fill="url(#fog)"/>
<g stroke="#b9a6ff" stroke-opacity=".075" stroke-width="1"><line x1="0" y1="26" x2="380" y2="26"/><line x1="0" y1="52" x2="380" y2="52"/><line x1="0" y1="78" x2="380" y2="78"/><line x1="0" y1="104" x2="380" y2="104"/></g>
<g class="vgrid" stroke="#b9a6ff" stroke-opacity=".075" stroke-width="1"></g>
<g class="series"></g>
<g class="marks"></g>
<g class="scan" opacity="0"><rect y="0" width="84" height="128" fill="url(#trail)"/><line y1="0" y2="128" x1="84" x2="84" stroke="#c9a6ff" stroke-width="1.6"/></g>
</svg>`);

}

/** Карточка сигнала по запросу: две карточки. Первая: параметры сигнала и «Открыть Pocket Option». Вторая: отсчёт, расписание, оценка */
function signalLive(sg,skew,cfg){
  liveSignalOn=true;   // пока карточка на экране, главную не перерисовываем по таймеру: иначе всё мигает
  const entry=Date.parse(sg.entry_at),gap=cfg.gapSec*1000,max=cfg.maxEvents;
  const up=sg.direction==='up';
  const p2=n=>String(n).padStart(2,'0');
  const hms=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
  const timerAt=t=>'0:'+p2((60-new Date(t).getSeconds())%60);
  const at=i=>entry+i*gap;
  const name=i=>i===0?'Вход':'Перекрытие '+i;
  const row=(k,v)=>el('div',{class:'r'},el('span',{},k),el('b',{},v));
  // Живая часть собирается один раз, дальше меняется только текст: без перерисовки нет и мигания
  const sTitle=el('div',{class:'sm'}),sBig=el('b',{style:'font-size:32px;color:var(--acc2);text-align:center;display:block;font-variant-numeric:tabular-nums;min-height:38px'}),sSub=el('div',{class:'sm',style:'text-align:center'});
  const status=el('div',{style:'display:grid;gap:6px;padding:4px 0 12px;border-bottom:1px solid var(--line)'},sTitle,sBig,sSub);
  const rows=Array.from({length:max},(_,i)=>{
    const mk=el('b',{style:'display:inline-block;width:18px'}),tm=el('span',{class:'mono'},hms(at(i)));
    return{mk,node:el('div',{class:'row sm'},el('span',{},mk,name(i)),tm)};
  });
  const list=el('div',{style:'display:grid;gap:6px;padding:12px 0'},rows.map(r=>r.node));
  const set=(node,txt)=>{if(node.textContent!==txt)node.textContent=txt};
  // Оценка: «Оценить сигнал» → Плюс/Минус → при плюсе номер шага 1–4 (1 = со входа, 2–4 = с перекрытий)
  const rateBox=el('div',{style:'display:grid;gap:10px;margin-top:4px'});
  const send=async(result,step)=>{try{await api('/signals/'+sg.id+'/rate',{method:'POST',body:{result,step}});await refreshMe().catch(()=>{});signalRated(sg,result,step)}catch(e){toast(e.message)}};
  const rate=el('button',{class:'btn o',type:'button',onclick:()=>pm()},'Оценить сигнал');

    el('div',{class:'two'},el('button',{class:'btn g',type:'button',onclick:()=>steps()},'Плюс'),el('button',{class:'btn r',type:'button',onclick:()=>send('loss')},'Минус')),
    el('button',{class:'back',type:'button',onclick:()=>rateBox.replaceChildren(rate)},'‹ Назад'))};
  const steps=()=>{rateBox.replaceChildren(el('b',{style:'font-size:15px'},'С какого шага зашёл плюс?'),
    el('div',{class:'sm'},'1 — со входа, 2–'+max+' — с перекрытий'),
    el('div',{style:'display:grid;grid-template-columns:repeat('+max+',minmax(0,1fr));gap:8px'},Array.from({length:max},(_,i)=>el('button',{class:'btn g',type:'button',onclick:()=>send('win',i+1)},String(i+1)))),
    el('button',{class:'back',type:'button',onclick:()=>pm()},'‹ Назад'))};
  rateBox.append(rate);
  function paint(){
    const now=nowMs();
    let n=0;while(n<max&&at(n)<=now)n++;   // n = первое событие, которое ещё впереди
    if(n>=max){set(sTitle,'Все события прошли. Дальше не идём.');sBig.style.visibility='hidden';set(sBig,'0:00');set(sSub,'Оцените сигнал ниже.')}
    else{

      set(sTitle,n===0?'До входа':'До перекрытия '+n);
      set(sBig,Math.floor(sec/60)+':'+p2(sec%60));
      set(sSub,name(n)+' в '+hms(at(n))+' (таймер свечи '+timerAt(at(n))+')');
    }
    rows.forEach((r,i)=>{
      const past=at(i)<=now,cur=i===n;

      r.mk.style.color=cur?'var(--acc2)':'var(--mut)';
      r.node.style.color=cur?'var(--fg)':'var(--mut)';
    });
    const lock=now<entry+5000; // оценка открывается через 5 секунд после входа, чтобы не упереться в расхождение часов
    if(rate.disabled!==lock)rate.disabled=lock;

  paint();timers.push(setInterval(paint,200));
  const pocket=()=>{const u=cfg.pocketUrl||'https://pocketoption.com/';openLink(u)};

    el('div',{class:'sig'},el('h3',{},'Сигнал готов'),

      el('div',{class:'r'},el('span',{},'Направление'),el('b',{style:'color:var(--'+(up?'ok':'bad')+')'},up?'ВВЕРХ (BUY)':'ВНИЗ (SELL)')),
      row('Время сделки',sg.expiry_sec?fmtDur(sg.expiry_sec):sg.expiry_min+' мин'),row('Ставка',cfg.stakeLabel),
      el('button',{class:'btn',type:'button',style:'margin-top:8px',onclick:pocket},'Открыть Pocket Option')),
    el('div',{class:'sig'},status,list,rateBox));

const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c};
/** Прошедшие сигналы: все завершённые, итог по отметкам клиентов, полоска показывает долю плюсов и минусов */
async function pastSignals(){
  const wrap=el('div',{});
  const nodes=new Map();   // ключ сигнала → строка списка, чтобы обновлять список без перерисовки
  let listEl=null,mode='';
  const keyOf=r=>String(r.id!==undefined?r.id:r.entry_at+r.pair);
  const sigOf=r=>r.wins+'/'+r.losses;
  const inner=r=>{
    const n=r.wins+r.losses,up=r.direction==='up';
    const cls=n===0||r.wins===r.losses?'n':r.wins>r.losses?'w':'l';
    const lab=cls==='w'?'Плюс':cls==='l'?'Минус':(n===0?'Нет итогов':'Поровну');
    const t=new Date(r.entry_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    return el('div',{class:'ps-in'},
      el('div',{class:'row'},el('div',{},el('b',{},r.pair+' · '+(up?'ВВЕРХ (BUY)':'ВНИЗ (SELL)')),el('div',{class:'sm'},t+' · '+(n+' '+plural(n,r.is_test?'голос':'отметка',r.is_test?'голоса':'отметки',r.is_test?'голосов':'отметок')))),el('span',{class:'pbadge '+cls},lab)));
  };
  const mkRow=r=>{const d=el('div',{class:'ps'},inner(r));d._sig=sigOf(r);return d};
  const full=rows=>{
    nodes.clear();listEl=null;
    const allTest=rows.length>0&&rows.every(r=>r.is_test);
    mode=allTest?'t':'r';
    const head=el('div',{class:'pshead'},el('b',{},'Прошедшие сигналы'),allTest?null:el('span',{class:'sm'},'по отметкам участников'));
    if(!rows.length){wrap.replaceChildren(head,el('div',{class:'card sm'},'Завершённых сигналов пока нет.'));return}
    listEl=el('div',{class:'pslist'},rows.map(r=>{const d=mkRow(r);nodes.set(keyOf(r),d);return d}));
    wrap.replaceChildren(head,listEl);
  };
  const enter=d=>{
    d.style.height='0px';d.style.opacity='0';
    listEl.offsetHeight;
    requestAnimationFrame(()=>{d.style.height=d.scrollHeight+'px';d.style.opacity='1';setTimeout(()=>{d.style.height='';d.style.opacity=''},520)});
  };
  const leave=d=>{
    d.style.height=d.offsetHeight+'px';d.style.borderTopWidth='0';
    d.offsetHeight;
    requestAnimationFrame(()=>{d.style.height='0px';d.style.opacity='0';setTimeout(()=>d.remove(),520)});
  };
  // Новый сигнал выезжает сверху, остальные сдвигаются вниз, самый нижний уходит
  const update=rows=>{
    const allTest=rows.length>0&&rows.every(r=>r.is_test);
    if(!listEl||!rows.length||(allTest?'t':'r')!==mode||!listEl.isConnected){full(rows);return}
    const keys=rows.map(keyOf);
    [...nodes].forEach(([k,d])=>{if(!keys.includes(k)){nodes.delete(k);leave(d)}});
    rows.forEach((r,i)=>{
      const k=keys[i],cur=nodes.get(k);
      if(cur){if(cur._sig!==sigOf(r)){cur.replaceChildren(inner(r));cur._sig=sigOf(r)}return}
      const d=mkRow(r);nodes.set(k,d);
      let next=null;for(let q=i+1;q<keys.length;q++){if(nodes.has(keys[q])&&keys[q]!==k){next=nodes.get(keys[q]);break}}
      listEl.insertBefore(d,next);enter(d);
    });
  };
  full(await api('/signals/past'));
  // Каждые 20 секунд сверяем список: новый сигнал появляется, самый старый уходит
  timers.push(setInterval(async()=>{if(!wrap.isConnected)return;try{update(await api('/signals/past'))}catch{}},20000));
  return[wrap];
}

/** Pocket ID ещё нет: «Добавить» превращается в поле и «Подтвердить». Принимается только ID из загруженной базы */

      style:'flex:1 1 0;min-width:0;width:100%;box-sizing:border-box;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:600 14px var(--fb)'});
