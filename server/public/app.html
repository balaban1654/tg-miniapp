<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0817">
<title>Hunter AI</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:'Montserrat';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Regular.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Medium.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-SemiBold.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Bold.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-ExtraBold.woff2') format('woff2')}
:root{--bg:#0d0817;--bg2:#150d26;--card:#1c1233;--card2:#251847;--line:#34255c;--fg:#f1ebff;--mut:#a89cc8;--acc:#9b5cff;--acc2:#c9a6ff;--acc3:#6a2fe0;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b8a;
--fd:'Montserrat',system-ui,sans-serif;--fb:'Montserrat',system-ui,sans-serif;--fm:'Montserrat',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* Полосу прокрутки не показываем, листать экран можно как обычно */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
body{font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#1a0f33,#0d0817 45%) fixed,var(--bg);color:var(--fg);font:14px/1.5 var(--fb);overscroll-behavior:none}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.25}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#root{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hd{position:sticky;top:0;z-index:5;background:#0d0817ee;backdrop-filter:blur(8px);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;gap:8px;align-items:center;font:700 15px var(--fd)}
.logo{width:28px;height:28px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font:700 12px var(--fd)}
.bname{display:grid;gap:2px;line-height:1.1;min-width:0}
.bname b{font:700 15px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onl2{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ok)}
.onl2 i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hr{display:flex;gap:8px;align-items:center}
.ava.lg{width:58px;height:58px;font-size:20px}
.ava img,.avb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.pillb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--mut);cursor:pointer}
.avb{overflow:hidden;width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);background:var(--card2);color:var(--acc2);font:700 12px var(--fd);cursor:pointer;display:grid;place-items:center;padding:0}
main{flex:1;padding:6px 16px 96px;display:grid;gap:12px;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.hero{border-color:var(--acc);display:grid;gap:10px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2a1857dd,var(--card) 70%)}
.card.hero>*{position:relative}
.hero-art{margin:-14px -14px 0;display:block;width:calc(100% + 28px);max-width:none;height:auto}

/* Живой график главной карточки рисуется скриптом (heroArt): свечи идут справа налево, линия-сканер иногда подсвечивает пару свечей */

/* Полноэкранный учебный терминал (урок 1) */
.fs-hd{gap:6px}.fs-hd .brand b{font:700 15px var(--fd)}
.xbtn{background:none;border:0;color:var(--mut);font-size:20px;line-height:1;padding:4px 8px 4px 0;cursor:pointer}
.steppill{border:1px solid var(--acc);color:var(--acc2);border-radius:99px;padding:6px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.fs-main{flex:1;padding:6px 16px 28px;display:grid;gap:14px;align-content:start}
.fs-bottom{position:sticky;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#0d0817f2;border-top:1px solid var(--line)}
.fs-tip{font:700 15px/1.4 var(--fd)}
.ptabs{display:flex;gap:8px}.ptabs button{flex:1;border:0;border-radius:12px;padding:11px 6px;background:var(--card);color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
.ptabs button.on{background:var(--acc);color:#fff}.ptabs button:disabled{opacity:.7}
.prow{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;background:var(--card);padding:18px 16px;color:var(--fg);font:700 15px var(--fd);cursor:pointer;text-align:left}
.prow:active{transform:scale(.99);background:var(--card2)}
.pay{background:#3ddc9722;color:var(--ok);border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700}
.note{color:var(--mut);font-size:12.5px;line-height:1.5}
.sig{border:1px solid var(--acc);border-radius:20px;padding:16px;background:var(--card);display:grid;gap:2px}
.sig h3{font-size:20px;margin-bottom:6px}
.sig .r{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.sig .r:last-of-type{border-bottom:0}
.sig .r span{color:var(--mut)}.sig .r b{text-align:right}
.demo{display:inline-block;border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;margin-bottom:6px}
.term{display:grid;gap:12px;position:relative}
.trow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chip{background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.dots{background:var(--card);border:0;border-radius:12px;width:46px;height:40px;font-size:18px;font-weight:700;color:var(--fg);cursor:pointer;letter-spacing:1px}
.bal{text-align:right;font-size:11px;color:var(--mut)}.bal b{display:block;font:700 18px var(--fd);color:var(--fg)}
.cv{position:relative;background:#120a24;border-radius:14px;overflow:hidden}
.cv svg{display:block;width:100%;height:auto}
.ttag{position:absolute;right:8px;bottom:8px;background:#ffffff1c;border-radius:6px;padding:2px 7px;font:700 12px var(--fm)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{background:var(--card);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;font:600 15px var(--fm)}
.fld label{display:block;font:500 11px var(--fb);color:var(--mut);margin-bottom:4px}
.fld button{width:30px;height:30px;border-radius:8px;border:0;background:var(--card2);font-weight:800;font-size:16px;color:var(--fg)}
.pl{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;align-items:center}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tb button{border:0;border-radius:14px;padding:16px;font:700 16px var(--fd);color:#fff;cursor:pointer}
.buy{background:#1f8f4e}.sell{background:#c23b4f}
.off{opacity:.38;pointer-events:none;filter:saturate(.7)}
.tg{position:relative;outline:2px solid var(--ok);outline-offset:2px;border-radius:14px;animation:tgp 1.4s ease-in-out infinite}
.tg::before{content:attr(data-n);position:absolute;top:-10px;left:-8px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#06210f;font:800 11px/20px var(--fd);text-align:center;z-index:3}
@keyframes tgp{50%{outline-color:#3ddc9755}}
.hint{position:absolute;z-index:6;background:#16322a;border:1px solid var(--ok);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;max-width:230px;box-shadow:0 8px 24px #0008}
.pop{position:absolute;z-index:5;left:0;right:0;top:46px;background:#1b1233;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:0 14px 40px #000a}
.pop h4{margin:2px 0 0;font:600 12.5px var(--fb);color:var(--mut)}
.srow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:14px;font:700 14px var(--fd);border:0;width:100%;color:var(--fg);cursor:pointer}
.sw{width:46px;height:26px;border-radius:99px;background:#ffffff26;position:relative;transition:.2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.opts{display:grid;gap:8px}.opts.c4{grid-template-columns:repeat(4,1fr)}.opts.c5{grid-template-columns:repeat(5,1fr)}
.opt{border:0;border-radius:11px;background:var(--card);padding:12px 4px;font:700 13px var(--fd);color:var(--fg);cursor:pointer}
.opt.on{background:#4b2f8f}
.live{position:absolute;left:10px;bottom:10px;background:#0d0817dd;border:1.5px solid var(--ok);border-radius:12px;padding:8px 18px;font:800 20px var(--fd)}
.cd{position:absolute;z-index:6;left:50%;top:84px;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;text-align:center;background:#16322aee;border:1px solid var(--ok);border-radius:16px;padding:14px 18px;box-shadow:0 8px 28px #000a;pointer-events:none}
.cdc{width:62px;height:62px;border-radius:50%;border:3px solid var(--ok);display:grid;place-items:center}
.fin{border:1px solid var(--ok);background:#12301f;border-radius:18px;padding:16px;display:grid;gap:10px}
.pshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.pshead b{font:700 16px var(--fd);white-space:nowrap}
.pshead span{font-size:11px;text-align:right}
.pslist{background:var(--card);border-radius:18px;overflow:hidden}
.ps{padding:14px 16px;display:grid;gap:8px}.ps+.ps{border-top:1px solid #ffffff10}
.pbadge{border:1px solid;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pbadge.w{color:var(--ok);border-color:var(--ok);background:#3ddc9712}.pbadge.l{color:var(--bad);border-color:var(--bad);background:#ff6b8a12}.pbadge.n{color:var(--mut);border-color:var(--line)}
.pbar{height:5px;border-radius:9px;background:#ffffff14;overflow:hidden;display:flex}
.pbar i{display:block;height:100%}.pbar .g{background:var(--ok)}.pbar .r{background:var(--bad)}
.since{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:18px}.since svg{width:17px;height:17px;flex:none;display:block;transform:translateY(2.1px)}
.ic svg{width:44px;height:44px;color:var(--acc2)}
.card.grad{background:linear-gradient(135deg,var(--acc3),#3a1c8a);border:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm{font-size:12px;color:var(--mut)} .mut{color:var(--mut)} .mono{font-family:var(--fm)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stats>*{min-width:0}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--card);border:0;border-radius:16px;padding:12px 8px 12px 14px}
.stat span{font-size:11px}
.stat b{display:block;font:700 20px var(--fm)}
.btn{display:block;width:100%;text-align:center;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.98)}.btn.o{background:none;border:1px solid var(--acc);color:var(--acc2)}.btn:disabled{opacity:.45}
.btn.g{background:var(--ok);color:#06210f}.btn.r{background:var(--bad);color:#2b0610}
.btn.sm2{padding:8px;font-size:12px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;font-size:12px;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rq{color:var(--fg);font-weight:600;font-size:14px}
.rrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtn{border:1.5px solid var(--acc);background:transparent;color:var(--acc2);border-radius:14px;padding:14px 6px;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s,color .15s,transform .1s,box-shadow .15s}
@media(hover:hover){.rbtn:hover{background:var(--acc);color:#fff;box-shadow:0 0 0 3px #9b5cff33}}
.rbtn:active,.rbtn:focus-visible{background:var(--acc);color:#fff;outline:none}
.rbtn:active{transform:scale(.97)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0b0616;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px;cursor:pointer}
.tabs button.on{color:var(--acc2);font-weight:700} .tabs svg{width:24px;height:24px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font:600 11px var(--fm)}
.p-ok{background:#3ddc9722;color:var(--ok)}.p-bad{background:#ff6b8a22;color:var(--bad)}.p-pur{background:#9b5cff33;color:var(--acc2)}.p-warn{background:#ffb84d22;color:var(--warn)}
.bars{display:flex;gap:6px;align-items:flex-end;height:80px}
.bars div{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start}
.bars i{display:block;border-radius:3px}.bars i.has{min-height:3px}
.bars .w{background:var(--ok)}.bars .l{background:var(--bad)}
.days{display:flex;gap:6px;color:var(--mut);font-size:10px}.days span{flex:1;text-align:center}
.ava{overflow:hidden;width:48px;height:48px;border-radius:50%;border:2px solid var(--acc);background:var(--card2);color:var(--acc2);font:700 18px var(--fd);display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:26px 10px;display:grid;gap:8px;justify-items:center}

.ext{display:grid;place-items:center;color:var(--mut,#9d8fc4);flex:none}
.lesson{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;color:inherit}
.num{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font:700 14px var(--fm);flex:none;color:var(--acc2)}
.num.done{background:var(--ok);color:#06210f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr{display:grid;gap:8px}
.back{background:none;border:0;color:var(--acc2);padding:4px 0;cursor:pointer;font-size:13px;text-align:left}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;text-align:center}
svg{max-width:100%}
.err{color:var(--bad)}
@media(max-width:350px){.stat{padding:8px 6px}.stat b{font-size:17px}.stat span{font-size:10px}main{padding-inline:12px}.hd{padding-inline:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
try{tg&&tg.ready();tg&&tg.expand();tg&&tg.setHeaderColor&&tg.setHeaderColor('#0d0817');tg&&tg.setBackgroundColor&&tg.setBackgroundColor('#0d0817')}catch{}
const $=s=>document.querySelector(s);
const root=$('#root');
let me=null,tab='home',region=null,timers=[];

function el(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v)}
  for(const k of kids.flat(Infinity))if(k!==null&&k!==undefined&&k!==false)e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
const svgEl=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const money=v=>'$'+Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const dmy=v=>new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}).replace(/\s*г\.?$/,'');
const hm=v=>new Date(v).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

async function api(path,opts={}){
  const r=await fetch('/api/app'+path,{method:opts.method||'GET',headers:{'content-type':'application/json',authorization:'tma '+(tg?tg.initData:'')},body:opts.body?JSON.stringify(opts.body):(opts.method&&opts.method!=='GET'?'{}':undefined)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||'Ошибка '+r.status);
  return data;
}
function toast(t){const n=el('div',{class:'toast',role:'status'},t);document.body.append(n);setTimeout(()=>n.remove(),2200)}
function openLink(u){
  if(!u)return;
  try{
    if(tg&&/^https:\/\/t\.me\//.test(u)&&tg.openTelegramLink)return tg.openTelegramLink(u);
    if(tg&&tg.openLink)return tg.openLink(u);
  }catch{}
  window.open(u,'_blank');
}
const photoUrl=()=>{try{return tg.initDataUnsafe.user.photo_url||''}catch{return ''}};
/** Ставит аватарку Telegram в круг. Пока картинка не загрузилась, остаётся буква. */
function withPhoto(node){
  const u=photoUrl();
  if(u){const img=new Image();img.alt='';img.referrerPolicy='no-referrer';img.onload=()=>node.replaceChildren(img);img.src=u}
  return node;
}
const CHAT_ICON='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 01-12.3 7.6L3.8 20.6l1.1-4.2A8.5 8.5 0 1120.5 12z"/></svg>';
function support(){
  openLink('https://t.me/'+me.botUsername+'?start=support');
  // на телефоне openTelegramLink сам Mini App не закрывает — закрываем явно
  try{if(tg&&tg.close)setTimeout(()=>tg.close(),300)}catch{}
}
function clearTimers(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[]}

const ICON={home:'<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',deals:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',trainer:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/>',media:'<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10 9.2l5 2.8-5 2.8z"/>'};
const TABS=[['home','Главная'],['deals','Сделки'],['trainer','Тренажёр'],['media','Медиа']];

function shell(title,body){
  const init=(me.name||'?').trim().slice(0,1).toUpperCase();
  root.replaceChildren(
    el('div',{class:'hd'},
      el('div',{class:'brand'},el('div',{class:'logo'},'H'),el('div',{class:'bname'},el('b',{},title||'Hunter AI'),el('span',{class:'onl2'},el('i'),'онлайн'))),
      el('div',{class:'hr'},el('button',{class:'pillb',type:'button',onclick:support},svgEl(CHAT_ICON),'Поддержка'),
        withPhoto(el('button',{class:'avb',type:'button','aria-label':'Профиль',onclick:()=>go('profile')},init)))),
    el('main',{},body),

/**
 * Декоративный «живой» график: последняя свеча тикает, каждые несколько секунд появляется новая, всё едет влево.
 * Линия-сканер проходит слева направо и ненадолго подсвечивает пару свечей, потом они гаснут до следующего прохода.
 * Это иллюстрация, а не анализ: цены случайные, сигналов и цифр здесь нет.
 */
function heroArt(){
  const NSV='http://www.w3.org/2000/svg';
  const W=380,DX=30,BW=21,LIVE_X=322,TOP=14,BOT=104,T=4.2,TICK=.12,CYCLE=6.4,SWEEP=3.6;
  const svg=svgEl(`<svg class="hero-art" viewBox="0 0 380 128" aria-hidden="true">
<defs>
<linearGradient id="trail" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9b5cff" stop-opacity="0"/><stop offset="1" stop-color="#9b5cff" stop-opacity=".26"/></linearGradient>
<linearGradient id="fog" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1c1233" stop-opacity="0"/><stop offset="1" stop-color="#1c1233" stop-opacity=".85"/></linearGradient>
</defs>
<path d="M0,128 L0,88 L26,78 L44,86 L74,54 L98,72 L128,40 L156,64 L190,48 L224,76 L262,58 L296,80 L330,64 L380,84 L380,128Z" fill="#3a2d6e" fill-opacity=".34"/><path d="M0,128 L0,102 L40,92 L70,100 L112,80 L150,94 L196,84 L240,100 L286,88 L330,100 L380,92 L380,128Z" fill="#2a2152" fill-opacity=".5"/><rect x="0" y="70" width="380" height="58" fill="url(#fog)"/>
<g stroke="#b9a6ff" stroke-opacity=".075" stroke-width="1"><line x1="0" y1="26" x2="380" y2="26"/><line x1="0" y1="52" x2="380" y2="52"/><line x1="0" y1="78" x2="380" y2="78"/><line x1="0" y1="104" x2="380" y2="104"/></g>
<g class="vgrid" stroke="#b9a6ff" stroke-opacity=".075" stroke-width="1"></g>
<g class="series"></g>
<g class="marks"></g>
<g class="scan" opacity="0"><rect y="0" width="84" height="128" fill="url(#trail)"/><line y1="0" y2="128" x1="84" x2="84" stroke="#c9a6ff" stroke-width="1.6"/></g>
</svg>`);
  const $=q=>svg.querySelector(q);
  const series=$('.series'),marks=$('.marks'),scan=$('.scan'),vgrid=$('.vgrid');
  const mk=(tag,attrs,parent)=>{const n=document.createElementNS(NSV,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);parent.appendChild(n);return n};
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  let price=100,id=0;
  const walk=()=>{price+=(Math.random()-.5)*1.5+(100-price)*.012;return price};
  const fresh=o=>({k:id++,o,c:o,h:o,l:o,born:0,el:null});
  const tickCandle=c=>{c.c=walk();c.h=Math.max(c.h,c.c);c.l=Math.min(c.l,c.c)};
  const candles=[];
  for(let i=0;i<16;i++){const c=fresh(i?candles[i-1].c:price);for(let j=0;j<Math.round(T/TICK);j++)tickCandle(c);candles.push(c)}
  const gridLines=[];
  for(let i=0;i<14;i++)gridLines.push(mk('line',{y1:0,y2:128},vgrid));

  let lo=0,hi=1,first=true,tAcc=0,frac=0,last=performance.now(),born=last,cycleStart=-99,picks=[],mark=[];
  const xOf=c=>LIVE_X+(c.k-candles[candles.length-1].k)*DX-frac*DX;

  function draw(now){
    const t=(now-born)/1000;
    // масштаб по видимым свечам, плавно
    let mn=1e9,mx=-1e9;
    for(const c of candles){if(xOf(c)<-DX)continue;mn=Math.min(mn,c.l);mx=Math.max(mx,c.h)}
    const pad=Math.max(1,(mx-mn)*.14);mn-=pad;mx+=pad;
    if(first){lo=mn;hi=mx;first=false}else{lo+=(mn-lo)*.07;hi+=(mx-hi)*.07}
    const Y=v=>TOP+(hi-v)/(hi-lo)*(BOT-TOP);

    // сканер: проход каждые CYCLE секунд, между проходами его не видно
    const ph=reduce?-1:(t%CYCLE);
    const cyc=Math.floor(t/CYCLE);
    if(!reduce&&cyc!==cycleStart){
      cycleStart=cyc;
      const live=candles[candles.length-1].k;
      const pool=[];for(let k=live-9;k<=live-2;k++)pool.push(k);
      picks=[];
      while(picks.length<2&&pool.length){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];if(picks.every(p=>Math.abs(p.k-k)>=3))picks.push({k,done:false})}
    }
    const sx=ph>=0&&ph<SWEEP?-14+(ph/SWEEP)*(LIVE_X+24):null;
    if(sx===null)scan.setAttribute('opacity',0);
    else{scan.setAttribute('opacity',Math.min(1,ph*3,(SWEEP-ph)*3));scan.setAttribute('transform','translate('+(sx-84).toFixed(1)+',0)')}

    // отметки: появляются, когда линия дошла до свечи, и быстро гаснут
    if(sx!==null)for(const p of picks){
      if(p.done)continue;const c=candles.find(c=>c.k===p.k);if(!c)continue;
      if(sx>=xOf(c)){p.done=true;const g=mk('g',{},marks);mark.push({k:p.k,t0:t,g,ring:mk('circle',{r:9,fill:'none',stroke:'#fff','stroke-opacity':.75,'stroke-width':2},g),dot:mk('circle',{r:2.2,fill:'#fff'},g),rip:mk('circle',{r:9,fill:'none',stroke:'#fff','stroke-width':1.2},g)})}
    }
    const hot=new Set();
    mark=mark.filter(m=>{
      const age=t-m.t0,c=candles.find(c=>c.k===m.k);
      if(!c||age>1.25){m.g.remove();return false}
      hot.add(m.k);
      const a=Math.min(1,age/.12)*Math.min(1,(1.25-age)/.4);
      m.g.setAttribute('transform','translate('+xOf(c).toFixed(1)+','+Y(c.c).toFixed(1)+')');
      m.g.setAttribute('opacity',a.toFixed(2));
      const p=Math.min(1,age/1.1);m.rip.setAttribute('r',(9+16*p).toFixed(1));m.rip.setAttribute('stroke-opacity',(.6*(1-p)).toFixed(2));
      return true;
    });

    // свечи
    for(const c of candles){
      const x=xOf(c);
      if(!c.el){c.el={g:mk('g',{},series)};c.el.w=mk('line',{'stroke-width':1.4},c.el.g);c.el.b=mk('rect',{width:BW},c.el.g)}
      if(x<-DX||x>W+DX){c.el.g.setAttribute('display','none');continue}
      c.el.g.removeAttribute('display');
      const up=c.c>=c.o,col=up?'#43b82f':'#ff3b1d';
      const yo=Y(c.o),yc=Y(c.c);
      c.el.w.setAttribute('x1',x.toFixed(1));c.el.w.setAttribute('x2',x.toFixed(1));c.el.w.setAttribute('y1',Y(c.h).toFixed(1));c.el.w.setAttribute('y2',Y(c.l).toFixed(1));c.el.w.setAttribute('stroke',col);
      c.el.b.setAttribute('x',(x-BW/2).toFixed(1));c.el.b.setAttribute('y',Math.min(yo,yc).toFixed(1));c.el.b.setAttribute('height',Math.max(1.6,Math.abs(yo-yc)).toFixed(1));c.el.b.setAttribute('fill',col);
      let o=.58;
      if(hot.has(c.k))o=1;
      else if(sx!==null&&x<=sx)o=Math.max(o,Math.min(1,.58+.42*(1-(sx-x)/80)));
      c.el.g.setAttribute('opacity',o.toFixed(2));
    }
    gridLines.forEach((l,i)=>{const x=LIVE_X+(i-9)*DX-frac*DX+DX/2;l.setAttribute('x1',x.toFixed(1));l.setAttribute('x2',x.toFixed(1))});
  }

  function loop(now){
    if(reduce)return;
    if(!svg.isConnected&&now-born>800){return}   // карточку убрали со страницы, останавливаемся
    if(document.hidden){requestAnimationFrame(loop);last=now;return}
    const dt=Math.min(.1,(now-last)/1000);
    if(now-last>=30){
      last=now;tAcc+=dt;frac+=dt/T;
      while(tAcc>=TICK){tAcc-=TICK;tickCandle(candles[candles.length-1])}
      if(frac>=1){frac-=1;const prev=candles[candles.length-1];const c=fresh(prev.c);candles.push(c);const old=candles.shift();if(old.el)old.el.g.remove()}
      draw(now);
    }
    requestAnimationFrame(loop);
  }
  draw(born);
  requestAnimationFrame(loop);
  return svg;
}

/** Карточка активного сигнала. Сигнал публикует человек (аналитик), тестовые видят только тестовые аккаунты */
async function signalCard(){
  const r=await api('/signals/active');
  const sg=r.signal;if(!sg)return null;
  const skew=Date.parse(r.now)-Date.now();
  const entry=Date.parse(sg.entry_at);

  const left=el('b',{class:'big',style:'font-size:22px;color:var(--acc2)'});
  const tick=()=>{const sec=Math.round((entry-(Date.now()+skew))/1000);
    left.textContent=sec>0?'До входа '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):'Время входа наступило'};
  tick();timers.push(setInterval(tick,1000));
  const up=sg.direction==='up';

    el('div',{class:'row'},el('h3',{style:'font-size:15px'},'Сигнал'),el('span',{class:'pill '+(sg.is_test?'p-warn':'p-pur')},sg.is_test?'ТЕСТ':'От аналитика')),
    sg.is_test?el('div',{class:'sm',style:'color:var(--warn)'},'Тестовый сигнал. Не для торговли.'):null,
    el('div',{class:'row'},el('b',{style:'font:700 17px var(--fd)'},sg.pair),el('span',{class:'pill '+(up?'p-ok':'p-bad')},up?'ВВЕРХ ▲':'ВНИЗ ▼')),
    el('div',{class:'row sm'},el('span',{},'Экспирация'),el('b',{class:'mono',style:'color:var(--fg)'},sg.expiry_min+' мин')),
    el('div',{class:'row sm'},el('span',{},'Вход в'),el('b',{class:'mono',style:'color:var(--fg)'},hm2)),
    sg.note?el('div',{class:'sm'},sg.note):null,
    left,take,
    sg.is_test?null:el('p',{class:'sm',style:'margin:0'},'Это мнение аналитика, а не гарантия результата. Торгуйте только той суммой, которую готовы потерять.'));
}

      tipNode=el('div',{class:'fs-tip'},r.res==='win'?'Сделка закрылась в плюс':r.res==='loss'?'Сделка закрылась в минус':'Цена закрылась на уровне входа');
    }else tipNode=el('div',{class:'fs-tip'},tips[t]||'');
    if(t==='buy'||t==='wait'){tipEl=tipNode;}
    const body=[tipNode,termBody];
    if(st.result){
      const r=st.result,col=r.res==='win'?'var(--ok)':r.res==='loss'?'var(--bad)':'var(--warn)';
      body.push(el('div',{class:'fin',style:'border-color:'+col},
        el('b',{style:'font:700 18px var(--fd);color:'+col},r.res==='win'?'+'+usd(r.pnl):r.res==='loss'?'−'+usd(-r.pnl):'Возврат: 0 $'),
        el('div',{class:'sm'},'Это учебный результат: график смоделирован, и исход получился случайным. В реальной торговле сигнал тоже не гарантирует плюс, поэтому ставка не больше 1–3% от депозита. Учебный баланс: '+usd(st.bal).replace(',00 $',' $')+'.'),
        el('button',{class:'btn',type:'button',onclick:async()=>{try{await api('/trainer/1/done',{method:'POST'})}catch{}tab='trainer';render()}},'Завершить урок')));
    }
    fsShell(pill,body);
    paint();liveText();
  };
  pairsView();
}

async function viewTrainer(sel){
  if(!me)await refreshMe();
  lessons=await api('/trainer');
  if(sel===1)return lesson1();
  if(sel){return lessonView(lessons.find(l=>l.id===sel))}
  const next=lessons.find(l=>!l.done)||lessons[0];
  shell('Тренажёр',[el('div',{},el('h2',{style:'font-size:20px'},'Тренажёр'),
    el('p',{class:'sm',style:'margin:8px 0 0;font-size:14px;line-height:1.5'},'Три урока на учебном графике: как настроить терминал и зайти по сигналу. Учебный баланс 1 000 $ — рисковать нечем.')),
    lessons.map(l=>el('button',{class:'lesson',type:'button',onclick:()=>viewTrainer(l.id)},el('div',{class:'num'+(l.done?' done':'')},l.done?'✓':l.id),el('div',{},el('b',{},'Урок '+l.id+' · '+l.title),el('div',{class:'sm'},l.sub)))),
    el('button',{class:'btn',type:'button',onclick:()=>viewTrainer(next.id)},'Продолжить')]);
}

function lessonView(l){
  const bal=()=>{try{return Number(localStorage.getItem('train_bal'))||1000}catch{return 1000}};
  const setBal=v=>{try{localStorage.setItem('train_bal',String(v))}catch{}};
  const balEl=el('b',{class:'mono'},money(bal()));
  const msg=el('div',{class:'sm',role:'status'},'Нажмите «Вверх» или «Вниз», результат через 8 секунд.');
  const svg=svgEl('<svg viewBox="0 0 280 120" role="img" aria-label="Учебный график" style="width:100%;height:150px"><polyline id="ln" fill="none" stroke="#c9a6ff" stroke-width="2"/><line id="en" x1="0" x2="280" stroke="#3ddc97" stroke-dasharray="4 4" visibility="hidden"/></svg>');
  let p=[];let v=100;for(let i=0;i<60;i++){v+=(Math.random()-.5)*2.2;p.push(v)}
  let entry=null,busy=false;
  const draw=()=>{const lo=Math.min(...p),hi=Math.max(...p),r=(hi-lo)||1;const y=x=>110-((x-lo)/r)*100;
    svg.querySelector('#ln').setAttribute('points',p.map((x,i)=>(i/(p.length-1)*280).toFixed(1)+','+y(x).toFixed(1)).join(' '));
    const en=svg.querySelector('#en');if(entry!==null){en.setAttribute('y1',y(entry));en.setAttribute('y2',y(entry));en.setAttribute('visibility','visible')}else en.setAttribute('visibility','hidden')};
  draw();
  timers.push(setInterval(()=>{p.push(p[p.length-1]+(Math.random()-.5)*2.2);p.shift();draw()},400));
  const bet=dir=>{
    if(busy)return;busy=true;entry=p[p.length-1];up.disabled=down.disabled=true;
    let left=8;msg.textContent='Сделка открыта. Осталось '+left+' с';
    const t=setInterval(()=>{left--;msg.textContent='Сделка открыта. Осталось '+left+' с';
      if(left<=0){clearInterval(t);const now=p[p.length-1];const diff=now-entry;
        const res=Math.abs(diff)<.01?'draw':((diff>0)===(dir==='up')?'win':'loss');
        const stake=50;let b=bal();
        if(res==='win'){b+=stake*.8;msg.textContent='Плюс! +'+money(stake*.8)}else if(res==='loss'){b-=stake;msg.textContent='Минус: −'+money(stake)+'. Так бывает, главное держать риск под контролем.'}else msg.textContent='Цена закрылась на уровне входа. Ставка возвращается.';
        setBal(b);balEl.textContent=money(b);entry=null;busy=false;up.disabled=down.disabled=false}},1000);
    timers.push(t)};
  const up=el('button',{class:'btn g',type:'button',onclick:()=>bet('up')},'Вверх ▲');
  const down=el('button',{class:'btn r',type:'button',onclick:()=>bet('down')},'Вниз ▼');
  const finish=el('button',{class:'btn',type:'button',onclick:async()=>{try{await api('/trainer/'+l.id+'/done',{method:'POST'});toast('Урок пройден');tab='trainer';render()}catch(e){toast(e.message)}}},l.done?'Пройти заново позже':'Отметить урок пройденным');
  shell('Урок '+l.id,[el('button',{class:'back',type:'button',onclick:()=>{tab='trainer';render()}},'‹ Назад к урокам'),
    el('h2',{style:'font-size:17px'},l.title),
    el('div',{class:'card'},el('ol',{class:'steps'},l.steps.map(s=>el('li',{},s)))),
    el('div',{class:'card'},el('div',{class:'row'},el('b',{},'Практика'),el('span',{class:'sm'},'Учебный баланс '),balEl),svg,msg,el('div',{class:'two',style:'margin-top:8px'},up,down)),
    finish]);
}

/** Иконка «открыть во внешней ссылке»: квадрат со стрелкой */
function extIcon(){
  const n=el('span',{class:'ext','aria-hidden':'true'});
  n.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 14v4.5a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 014 18.5v-11A1.5 1.5 0 015.5 6H10"/><path d="M14 4h6v6"/><path d="M20 4l-9 9"/></svg>';
  return n;
}
/** Круг с аватаркой из Telegram. Пока не загрузилась или нет фото, показываем первую букву */
function mediaAva(x,size){
  const n=el('div',{class:'ava',style:size?'width:'+size+'px;height:'+size+'px;flex:none':''},(x.title||'?').slice(0,1).toUpperCase());
  if(x.photo){const img=new Image();img.alt='';img.onload=()=>n.replaceChildren(img);img.src=x.photo}
  return n;
}

  if(!me)await refreshMe();

  const ch=m.channels.length?m.channels.map(c=>el('button',{class:'lesson',type:'button',onclick:()=>openLink(c.url)},mediaAva(c,44),el('div',{style:'flex:1'},el('b',{},c.title),el('div',{class:'sm'},c.subtitle||'')),extIcon())):[el('div',{class:'card sm'},'Каналы скоро появятся.')];
  const tr=m.traders.length?el('div',{class:'two'},m.traders.map(t=>el('div',{class:'card tr'},mediaAva(t),el('b',{},t.title),el('div',{class:'sm'},t.subtitle||'Трейдер команды'),el('button',{class:'btn o sm2',type:'button',onclick:()=>openLink(t.url)},'Канал трейдера')))):el('div',{class:'card sm'},'Трейдеры скоро появятся.');
  shell('Медиа',[el('b',{},'Наши трейдеры'),tr,el('b',{},'Каналы команды'),ch]);
}
