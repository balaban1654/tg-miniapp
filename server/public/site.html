<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunter AI</title>
<meta name="description" content="Анализ рынка и сигналы — прямо в Telegram. Сайт скоро откроется, а пока всё уже работает в нашем боте.">
<meta name="theme-color" content="#0b0614">
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(/fonts/Montserrat-Medium.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(/fonts/Montserrat-Bold.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:800;font-display:swap;src:url(/fonts/Montserrat-ExtraBold.woff2) format('woff2')}
:root{--bg:#0b0614;--fg:#f1ebff;--mut:#b6a9d6;--acc:#9b5cff;--acc2:#c9a6ff;--acc3:#6a2fe0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{overflow-y:auto;background:radial-gradient(900px 600px at 50% 28%,#2a1659 0%,#150b2b 45%,var(--bg) 100%);color:var(--fg);font-family:Montserrat,system-ui,sans-serif;display:grid;grid-template-rows:1fr auto;overflow-x:hidden;position:relative}
main{overflow-x:clip;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;position:relative;z-index:1}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.rain i{position:absolute;top:-60px;width:5px;border-radius:2px;opacity:.5;animation:fall linear infinite}
.rain i::before{content:"";position:absolute;left:50%;top:-10px;bottom:-10px;width:1px;background:inherit;transform:translateX(-50%)}
@keyframes fall{to{transform:translateY(calc(100vh + 140px))}}
.logo{position:relative;width:min(500px,100%);aspect-ratio:500/340;margin-bottom:18px}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.logo .back{z-index:1}.logo .front{z-index:3}
.planet{position:absolute;z-index:2;left:29%;top:50%;width:42%;aspect-ratio:1;margin-top:-21%;perspective:700px}
.core{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--acc);background:#000;box-shadow:0 0 44px #9b5cff77,inset 0 0 30px #9b5cff55;will-change:transform;animation:glow 4s ease-in-out infinite}
.core img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.14);will-change:transform;user-select:none;-webkit-user-drag:none}
.core::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);mix-blend-mode:screen;transform:translateX(-130%);animation:shine 5.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 70px #9b5cffb0,inset 0 0 36px #9b5cff77}}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
h1{font-weight:800;font-size:clamp(30px,6vw,58px);line-height:1.1;letter-spacing:-.01em;max-width:900px}
h1 span{color:var(--acc)}
p{color:var(--mut);font-weight:500;font-size:clamp(14px,2vw,17px);line-height:1.6;max-width:520px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:16px 30px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 10px 36px #9b5cff55;transition:transform .15s,background .15s}
.btn:hover{background:#a975ff;transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98);background:var(--acc3)}
.btn:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
footer a{color:inherit;text-decoration:underline;text-underline-offset:2px}
footer{position:relative;z-index:1;text-align:center;color:#8f82b3;font-size:12px;padding:0 20px 22px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.rain i,.core,.core::after{animation:none}}
</style>
</head>
<body>
<div class="rain" id="rain" aria-hidden="true"></div>
<main>
  <div class="logo" id="logo" aria-hidden="true">
    <svg class="back" id="back" viewBox="-250 -170 500 340"></svg>
    <div class="planet" id="planet"><div class="core" id="core"><img id="face" src="/img/hunter.webp" width="720" height="720" alt="" draggable="false"></div></div>
    <svg class="front" id="front" viewBox="-250 -170 500 340"></svg>
  </div>
  <h1>Добро пожаловать<br>в <span>Hunter AI</span></h1>
  <p>Анализ рынка и сигналы — прямо в Telegram. Сайт скоро откроется, а пока всё уже работает в нашем боте.</p>
  <a class="btn" href="https://t.me/{{BOT}}" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 3.6 2.6 11c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3.2-15.2c.3-1.3-.5-1.9-1.4-1.5ZM8.4 13.5 18.8 7c.5-.3.9-.1.6.2l-8.7 7.8-.3 3.8z"/></svg>
    Открыть бота
  </a>
</main>
<footer>© Hunter AI · <a href="/terms">Условия использования</a></footer>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg',still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var core=document.getElementById('core'),face=document.getElementById('face');
  var back=document.getElementById('back'),front=document.getElementById('front');
  function mk(tag,attrs,parent){var n=document.createElementNS(NS,tag);for(var k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n}
  // Орбиты: заднюю половину рисуем под аватаркой, переднюю поверх неё
  var ORB=[{rx:215,ry:66,tilt:-14,sp:.11},{rx:178,ry:50,tilt:23,sp:-.07}];
  [[back,'b',-300],[front,'f',0]].forEach(function(L){
    var defs=mk('defs',{},L[0]);var cp=mk('clipPath',{id:'c'+L[1],clipPathUnits:'userSpaceOnUse'},defs);
    mk('rect',{x:-400,y:L[2],width:800,height:300},cp);
    L[0]._orbs=ORB.map(function(o){
      var g=mk('g',{transform:'rotate('+o.tilt+')'},L[0]);var c=mk('g',{'clip-path':'url(#c'+L[1]+')'},g);
      mk('ellipse',{rx:o.rx,ry:o.ry,fill:'none',stroke:'#9b5cff',opacity:.4,'stroke-width':1.2},c);
      var gl=mk('ellipse',{rx:o.rx,ry:o.ry,fill:'none',stroke:'#d9bfff','stroke-width':2.4,'stroke-linecap':'round',pathLength:100,'stroke-dasharray':'14 86',opacity:.9},c);
      var dot=mk('circle',{r:4.5,fill:'#e6d4ff'},c);dot.style.filter='drop-shadow(0 0 6px #b98cff)';
      return{gl:gl,dot:dot,o:o};
    });
  });
  // Пульс от круга аватарки
  var pulses=[0,1].map(function(){return mk('circle',{cx:0,cy:0,fill:'none',stroke:'#b98cff'},back)});
  var tx=0,ty=0,cx=0,cy=0,t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000;
    [back,front].forEach(function(S){S._orbs.forEach(function(it){
      var a=t*it.o.sp*Math.PI*2;
      it.dot.setAttribute('cx',(it.o.rx*Math.cos(a)).toFixed(2));it.dot.setAttribute('cy',(it.o.ry*Math.sin(a)).toFixed(2));
      it.gl.setAttribute('stroke-dashoffset',(-(t*it.o.sp*100)%100).toFixed(2));
    })});
    pulses.forEach(function(c,i){var p=((t/3.6)+i*.5)%1;c.setAttribute('r',(106+78*p).toFixed(1));c.setAttribute('stroke-opacity',(.6*Math.pow(1-p,1.6)).toFixed(3));c.setAttribute('stroke-width',(2.4-1.4*p).toFixed(2))});
    cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
    face.style.transform='translate('+(cx*9).toFixed(2)+'px,'+(cy*9).toFixed(2)+'px) scale(1.14)';
    core.style.transform='rotateY('+(cx*9).toFixed(2)+'deg) rotateX('+(-cy*9).toFixed(2)+'deg)';
    if(!still)requestAnimationFrame(frame);
  }
  if(!still){
    addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});
    document.addEventListener('pointerleave',function(){tx=0;ty=0});
  }
  requestAnimationFrame(frame);
})();
(function(){
  var rain=document.getElementById('rain');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(var i=0;i<26;i++){
    var c=document.createElement('i');
    var h=14+Math.random()*34;
    c.style.cssText='left:'+(Math.random()*100)+'%;height:'+h+'px;background:'+(Math.random()<.5?'#43b82f':'#ff3b1d')+';opacity:'+(.15+Math.random()*.3)+';animation-duration:'+(14+Math.random()*18)+'s;animation-delay:-'+(Math.random()*30)+'s';
    rain.appendChild(c);
  }
})();
</script>
</body>
</html>
