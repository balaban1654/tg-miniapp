<title>Hunter Office Lite</title>
<!-- Облегчённая версия Office для старых устройств (iPad на iOS 9, Safari 9): без современного JavaScript и CSS Grid.
     Дашборд как в Office: эфир, план/факт, воронка, чистая прибыль, зарплаты, расходы, требует внимания, эфиры за период. Только просмотр. Вход тем же логином, паролем и кодом -->
<style>
body{margin:0;background:#000;color:#f1ebff;font:14px/1.5 Montserrat,-apple-system,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.card{background:#1c1233;border:1px solid #34255c;border-radius:14px;padding:18px}
.mut{color:#a89cc8}
.pos{color:#3ddc97}.neg{color:#ff6b8a}.warn{color:#ffb84d}
.hide{display:none!important}
input{width:100%;padding:12px;margin:6px 0 12px;font-size:17px;border-radius:10px;border:1px solid #34255c;background:#150d26;color:#f1ebff;-webkit-appearance:none}
.btn{padding:12px 16px;font-size:15px;font-weight:bold;border:0;border-radius:10px;background:#9b5cff;color:#fff;-webkit-appearance:none}
.err{color:#ff6b8a;margin:6px 0}
/* Шапка */
.top{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:16px}
.ttl{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.ttl h2{font-size:24px;margin:0 12px 0 0}
.onl{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.27);color:#3ddc97;font-size:12px;font-weight:600;margin-right:12px}
.onl i{display:inline-block;width:7px;height:7px;border-radius:7px;background:#3ddc97;margin-right:6px;vertical-align:1px;-webkit-animation:blink 1.4s ease-in-out infinite;animation:blink 1.4s ease-in-out infinite}
@-webkit-keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.sub{color:#a89cc8;font-size:14px}
.seg{display:inline-block;background:#1c1233;border:1px solid #34255c;border-radius:10px;padding:3px;margin-top:6px}
.seg button{border:0;background:none;color:#a89cc8;padding:7px 12px;border-radius:7px;font-size:13px;font-family:inherit;-webkit-appearance:none}
.seg button.on{background:#9b5cff;color:#fff;font-weight:700}
/* Полоса стримеров */
.live{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;padding:12px 14px 2px;margin-bottom:16px}
.lc{padding:7px 12px;border:1px solid #34255c;border-radius:10px;background:#150d26;margin:0 10px 10px 0}
.lc b{font-weight:600;font-size:14px}
.lc .t{display:block;font-size:18px;font-weight:700;color:#3ddc97}.lc .t.off{color:#a89cc8;font-size:14px;font-weight:500}
.lc .liv{font-size:9px;font-weight:800;letter-spacing:2px;color:#ff6b8a;margin-left:8px;vertical-align:2px;-webkit-animation:livb 1.3s ease-in-out infinite;animation:livb 1.3s ease-in-out infinite}
@-webkit-keyframes livb{0%,100%{opacity:1}50%{opacity:.25}}@keyframes livb{0%,100%{opacity:1}50%{opacity:.25}}
.hp{font-size:12px;font-weight:500;margin-left:4px}.fc{margin-left:6px;font-size:12px;font-weight:700;color:#3ddc97}
.more{color:#c9a6ff;font-weight:700;font-size:13px;border-style:dashed;padding:14px 12px;font-family:inherit;-webkit-appearance:none}
/* Колонки */
.cols{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch}
.c1{-webkit-flex:1.5 1 0;flex:1.5 1 0;min-width:0;margin-right:16px}
.c2{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.c2 .card{margin-bottom:16px}.c2 .card.last{margin-bottom:0;-webkit-flex:1;flex:1}
@media (max-width:820px){.cols{display:block}.c1{margin:0 0 16px}}
.lbl{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#a89cc8}
.hd{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center}
.ib{border:1px solid #34255c;background:#1c1233;color:#a89cc8;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;margin-left:8px;font-family:inherit;-webkit-appearance:none}
.ib.on{color:#c9a6ff;border-color:#9b5cff}
/* План / факт */
.m{padding:14px 0;border-bottom:1px solid #34255c}.m:last-child{border:0;padding-bottom:0}
.m .v{font-weight:700;font-size:26px;letter-spacing:-.02em}.m .v small{font-size:14px;color:#a89cc8;font-weight:500}
.bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin:6px 0 4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#9b5cff;background:-webkit-linear-gradient(left,#6a2fe0,#9b5cff);background:linear-gradient(90deg,#6a2fe0,#9b5cff)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#f1ebff;border-radius:1px}

  if (!s || !last) return;
  var d = last.d, m = s.month || {}, plan = d.plan || {}, pace = plan.paceMin || 0, hrs = m.hoursMin || 0, planMin = plan.planMin || (plan.hours || 0) * 60 || 1;
  var lv = lvl(hrs, pace), col = lv === 'pos' ? '#3ddc97' : lv === 'warn' ? '#ffb84d' : '#ff6b8a';
  var pct = Math.round(hrs / planMin * 100), pp = Math.round(pace / planMin * 100);
  var tot = function (k) { return [m.baseMin, m.baseFull][k] + [m.leadsMin, m.leadsFull][k] + (m.ftdBonus || 0) + (m.dayBonus || 0) + (m.depBonus || 0) + (m.bonus || 0) - (m.penalty || 0); };
  var pay = [Math.max(0, tot(0) - (m.paid || 0)), Math.max(0, tot(1) - (m.paid || 0))];
  var comm = m.commissionCard != null ? m.commissionCard : (m.commission || 0), cost = tot(1), profit = comm - cost, ratio = cost > 0 ? comm / cost : 99;
  var vc = 'g', vt = 'Выгоден', vx = 'приносит $' + ratio.toFixed(1).replace('.', ',') + ' комиссии на каждый $1 зарплаты';
  if (ratio < 1) { vc = 'r'; vt = 'Убыточен'; vx = 'зарплата больше комиссии'; } else if (ratio < 2) { vc = 'y'; vt = 'На грани'; vx = 'комиссия лишь в ' + ratio.toFixed(1).replace('.', ',') + ' раза больше зарплаты'; }
  if (hrs < pace * 0.85 && vc === 'g') vx += '. Но сильно отстаёт по часам, ' + hw(hrs) + ' из ' + plan.hours + ' ч';
  var row = function (a, b, cls) { return '<div class="sm-row"><span>' + a + '</span><b' + (cls ? ' class="' + cls + '"' : '') + '>' + b + '</b></div>'; };
  var pair = function (a, b, last2) { return '<span class="sm-dm">' + usd(a) + '</span><span class="sm-sl">/</span><span' + (last2 ? ' class="' + last2 + '"' : '') + '>' + usd(b) + '</span>'; };
  var z = function (v) { return v ? sgn(v) : '$0'; };
  var elapsed = s.live ? Math.max(0, Math.floor((Date.now() - Date.parse(s.live.started_at)) / 60000)) : 0;
  var left = s.live && s.minLeft != null ? s.minLeft : null;
  var prem = (m.bonus || 0) - (m.refBonus || 0);
  var h = '<div class="sm-h"><div class="sm-av"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>' +
    '<div><h2>' + esc(s.name) + '</h2><div class="tg">' + esc(s.tg ? '@' + String(s.tg).replace(/^@/, '') : (s.login || '')) + '</div></div><div class="sm-sp"></div>' +
    '<div style="white-space:nowrap"><span class="sm-st' + (s.live ? '' : ' off') + '">' + (s.live ? 'в эфире ' + hm(elapsed) : 'не в эфире · ' + esc(offText(s, d.today))) + '</span><button class="sm-x" id="cx" aria-label="Закрыть">×</button></div></div>';
  h += '<div class="g"><div class="sm-hd"><span class="sm-sec">Часы за месяц</span><span>' + (left !== null ? '<span class="sm-cl">До закрытия: ' + hm(left) + '</span>' : '') + '<b style="color:' + col + '">' + hw(hrs) + ' / ' + plan.hours + ' ч</b></span></div>' +
    '<div class="sm-bar"><i style="width:' + Math.min(100, pct) + '%;background:' + col + '"></i><u style="left:' + Math.min(100, pp) + '%"></u></div>' +
    '<div class="sm-meta"><span>' + pct + '% плана</span><span>по графику на сегодня ' + hw(pace) + ' ч</span></div></div>';
  h += '<div class="sm-sg"><div class="c"><span>Смен</span><b>' + (m.shifts || 0) + '</b></div><div class="c"><span>FTD</span><b>' + (m.ftd || 0) + '</b></div><div class="c"><span>FTD $</span><b>' + usd(m.ftdSum) + '</b></div><div class="c"><span>Total $</span><b>' + usd(m.deposits) + '</b></div></div>';
  h += '<div class="g"><div class="sm-big">Зарплата за месяц</div><div class="sm-sal">' +
    '<div class="sm-col l"><div class="sm-sh f">База</div>' + row('Ставка (' + (m.shifts || 0) + ' смен)', pair(m.baseMin, m.baseFull)) + row('Лиды (' + (m.ftd || 0) + ')', pair(m.leadsMin, m.leadsFull)) +
      '<div class="sm-sh">Бонусы</div>' + row('FTD (суммы больше)', z(m.ftdBonus)) + row('Дневной (' + (plan.dayCount || 4) + ' FTD)', z(m.dayBonus)) + row('Додепы (градации)', z(m.depBonus)) + row('Премии', z(prem)) + '</div>' +
    '<div class="sm-col r"><div class="sm-sh f">Удержания</div>' + row('Штрафы', m.penalty ? sgn(-m.penalty) : '$0', m.penalty ? 'sm-neg' : '') + row('Выплачено (аванс)', m.paid ? sgn(-m.paid) : '$0') +
      '<div class="sm-fill"></div>' + row('Рефералы' + (m.refN ? ' (' + m.refN + ')' : ''), z(m.refBonus)) +
      '<div class="sm-pay"><span>К выплате</span><b>' + pair(pay[0], pay[1], 'okc') + '</b></div></div></div></div>';
  if (myRole === 'admin' || myRole === 'teamlead')
    h += '<div class="g"><div class="sm-sec" style="margin-bottom:6px">Выгоден ли сотрудник</div>' + row('Комиссия с лидов', usd(comm)) + row('Зарплата по полным ставкам', '−' + usd(cost), 'sm-neg') +
      '<div class="sm-res"><span>Прибыль с сотрудника</span><b' + (profit < 0 ? ' class="sm-neg"' : '') + '>' + sgn(profit) + '</b></div>' +
      '<div class="sm-vd ' + vc + '"><b>' + vt + '.</b> ' + vx + '.</div></div>';
  h += '<div class="g sm-ft">Данные за ' + esc(perLabel(m.period || d.today.slice(0, 7))) + '</div>';
  $('card').innerHTML = '<div class="so" id="cov"></div><div class="sm" id="smd">' + h + '</div>';
  $('card').className = '';
  $('cov').onclick = closeCard; $('cx').onclick = closeCard;
  smFit();
}
// Карточка всегда видна целиком: по центру экрана, а если выше экрана, уменьшается пропорционально
function smFit() {
  var md = $('smd'); if (!md) return;
  var vh = window.innerHeight || document.documentElement.clientHeight, k = Math.min(1, (vh - 24) / md.offsetHeight);
  var t = 'translate(-50%,-50%) scale(' + k + ')';
  md.style.webkitTransform = t; md.style.transform = t;
}
window.addEventListener('resize', smFit, false);
window.addEventListener('orientationchange', function () { setTimeout(smFit, 300); }, false);

// ---------- Карточка клиента (по нажатию на Telegram ID), только просмотр ----------
function dt(v) { if (!v) return '—'; var d = new Date(v); return d.getDate() + ' ' + MS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function openCard(id) {
  $('card').innerHTML = '<div class="cov" id="cov"></div><div class="cbox"><div class="mut">Загрузка…</div></div>';
  $('card').className = '';
  $('cov').onclick = closeCard;
  req('GET', '/api/office/leads/' + encodeURIComponent(id), null, function (st, d) {
    if (st !== 200) { $('card').innerHTML = '<div class="cov" id="cov"></div><div class="cbox"><div class="err">' + esc(d.error || 'Лид не найден') + '</div><button class="ib" id="cx" style="margin:12px 0 0">Закрыть</button></div>'; $('cov').onclick = closeCard; $('cx').onclick = closeCard; return; }
    renderCard(d);
  });
}
function closeCard() { $('card').className = 'hide'; $('card').innerHTML = ''; }
function renderCard(d) {
  var L = d.lead, i, h = '', ev = d.events || [];
  var st = LST[L.status] || [L.status, 'st-new'];
  var first = function (t) { for (var j = 0; j < ev.length; j++) if (ev[j].type === t) return ev[j]; return null; };
  var kv = function (k, v) { return '<div class="kv"><span class="mut">' + k + '</span><b>' + (v === null || v === undefined || v === '' ? '—' : v) + '</b></div>'; };
  h += '<div class="chd"><div><h2 style="margin:0">' + esc(L.first_name || (L.username ? '@' + L.username : L.tg_id)) + '</h2>' + (L.username && L.first_name ? '<div class="mut">@' + esc(L.username) + '</div>' : '') + '</div>' +
    '<div><span class="st ' + st[1] + '">' + st[0] + '</span> <span class="st ' + (L.access ? 'st-ftd' : 'st-new') + '">доступ ' + (L.access ? 'открыт' : 'закрыт') + '</span>' + (L.banned_at ? ' <span class="st st-ch">заблокирован</span>' : '') + ' <button class="ib" id="cx">✕</button></div></div>';
  var from = L.link_source || L.link_slug || L.origin || 'miniapp-org';
  h += '<div class="kvs">' + kv('Telegram ID', esc(L.tg_id)) + kv('Pocket ID', esc(L.trader_id || '')) + kv('Откуда пришёл', esc(from)) +
    kv('Владелец', esc(L.owner_name || 'не закреплён')) + kv('Страна', esc(d.country || '')) + (L.referrer_id ? kv('Пригласил', '<a href="#" data-card="' + esc(L.referrer_id) + '" style="color:#f1ebff;text-decoration:none">' + esc(L.referrer_id) + '</a>') : kv('Часовой пояс', esc(L.tz || ''))) +
    kv('Промокод', esc(d.promo || '')) + kv('Последний визит', dt(L.last_seen_at)) + (L.referrer_id ? kv('Часовой пояс', esc(L.tz || '')) : '') + '</div>';
  if (L.banned_at) h += '<div class="err" style="margin-top:8px">Заблокирован ' + dt(L.banned_at) + (L.ban_reason ? ': ' + esc(L.ban_reason) : '') + '</div>';
  // Путь клиента
  var steps = [['Нажал «Старт» в боте', first('start') || (L.bot_started ? { created_at: L.created_at } : null)], ['Регистрация', first('reg')], ['Первый депозит', first('ftd')]];
  var path = '';
  for (i = 0; i < steps.length; i++) path += '<div class="step' + (steps[i][1] ? ' on' : '') + '"><b>' + steps[i][0] + '</b><span class="mut">' + (steps[i][1] ? dt(steps[i][1].created_at) + (steps[i][1].amount ? ' · ' + usd2(steps[i][1].amount) : '') : 'ещё нет') + '</span></div>';
  // Финансы
  var F = d.fin || {}, fin = '', T = [['ftd', 'st-ftd'], ['dep', 'st-act'], ['wd', 'st-test'], ['comm', 'st-ch'], ['bonus', 'st-new']];
  for (i = 0; i < T.length; i++) { var f = F[T[i][0]]; if (!f || (T[i][0] === 'bonus' && !f.count)) continue; fin += '<div class="fr"><span class="st ' + T[i][1] + '" style="width:58px;text-align:center">' + T[i][0] + '</span><b>' + (f.sum === null ? '—' : usd2(f.sum)) + '</b><span class="mut">' + f.count + ' шт</span></div>'; }
  fin += '<div class="fr"><span style="width:58px">Рефералов</span><b></b><span class="mut">' + (d.refs || []).length + ' шт</span></div>';
  h += '<div class="c2c"><div><div class="sec">Путь клиента</div>' + path + '</div><div><div class="sec">Финансы по постбекам</div>' + fin + '</div></div>';
  // Градации
  if (d.tier && d.tier.tiers) {
    var tg = '', IC = ['🥉', '🥈', '🥇', '💎'];
    for (i = 0; i < d.tier.tiers.length; i++) { var got = i < d.tier.reached; tg += '<div class="tier' + (got ? ' on' : '') + '"><div>' + IC[i] + '</div><b>' + esc(d.tier.tiers[i].name) + '</b><span class="mut">' + (got ? 'достигнута' : i === d.tier.reached ? 'следующая' : 'впереди') + '</span></div>'; }
    h += '<div class="sec">Градации додепов</div><div class="tiers">' + tg + '</div>';
  }
  // Подключение
  if (d.connect) {
    var C = d.connect;
    h += '<div class="sec">Подключение</div><div class="kvs">' + kv('Нужно пополнить', usd2(C.required) + ' (от ' + usd2(C.from) + ')') + kv('Внесено', C.deposited === null ? '—' : usd2(C.deposited)) + kv('Акция', C.offer ? esc(C.offer.name) + ' до ' + dt(C.offer.until) : 'нет') + '</div>';
  }
  $('card').innerHTML = '<div class="cov" id="cov"></div><div class="cbox">' + h + '</div>';
  $('cov').onclick = closeCard; $('cx').onclick = closeCard;
  var rc = document.querySelectorAll('[data-card]');
  for (i = 0; i < rc.length; i++) rc[i].onclick = function (e) { e.preventDefault(); openCard(this.getAttribute('data-card')); };
}

function usd2(n) { n = Number(n) || 0; var r = Math.round(Math.abs(n) * 100) / 100, s = String(r).split('.'); return (n < 0 ? '−$' : '$') + grp(s[0]) + (s[1] ? ',' + (s[1].length < 2 ? s[1] + '0' : s[1]).replace(/0$/, '') : ''); }

$('lbtn').onclick = function () {
  $('lerr').innerHTML = '';
  if (!challenge) {
    req('POST', '/api/office/login', { login: $('lg').value, password: $('pw').value }, function (st, d) {
      if (st !== 200) { $('lerr').innerHTML = esc(d.error || 'Ошибка входа'); return; }
      if (d.need_totp) { challenge = d.challenge; $('step1').className = 'hide'; $('step2').className = ''; $('code').focus(); return; }
      showMain();
    });
  } else {
    req('POST', '/api/office/login/totp', { challenge: challenge, code: $('code').value.replace(/\s/g, '') }, function (st, d) {
      if (st !== 200) {
        $('lerr').innerHTML = esc(d.error || 'Неверный код');
        if (d.restart) { challenge = null; $('step1').className = ''; $('step2').className = 'hide'; }
        return;
      }
      showMain();
    });
  }
};

// Уже вошли (cookie сессии): сразу данные, иначе форма входа. Дальше сами обновляем раз в минуту
req('GET', '/api/office/me', null, function (st, d) { if (st === 200) { myRole = d.role || ''; showMain(); } else showLogin(); });
setInterval(function () { if ($('main').className !== 'hide') load(); }, 60000);

// Экран не гаснет, пока открыт дашборд. Новые браузеры: Wake Lock. Старая iOS (9) его не знает: каждые 15 с начинаем
// и сразу отменяем переход на эту же страницу, iOS считает это активностью и не гасит экран (приём NoSleep.js для iOS < 10).
// Включается после первого касания экрана: так требует iOS
var awakeOn = false;
function keepAwake() {
  if (awakeOn) return;
  awakeOn = true;
  if (navigator.wakeLock && navigator.wakeLock.request) {
    var lock = function () { navigator.wakeLock.request('screen').then(null, function () {}); };
    lock();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) lock(); }, false);
    return;
  }
  setInterval(function () {
    if (document.hidden) return;
    window.location.href = window.location.href.split('#')[0];
    setTimeout(function () { if (window.stop) window.stop(); }, 0);
  }, 15000);
}
document.addEventListener('touchend', keepAwake, false);
document.addEventListener('click', keepAwake, false);

// Обновление свайпом вниз: потянули страницу в самом верху больше чем на 70 px и отпустили — данные загружаются заново.
// На экране «Домой» у Safari нет своего «потяните для обновления», поэтому делаем сами
var ptrY = null, ptrD = 0, ptrBusy = false, ptrMode = '';
var ptrOpt = false;
try { window.addEventListener('test', null, Object.defineProperty({}, 'passive', { get: function () { ptrOpt = { passive: false }; return true; } })); } catch (e) {}
// Полоса обновления лежит под дашбордом; дашборд сдвигается вниз transform-ом, поэтому ничего не перестраивается и не дёргается
function ptrMove(y, anim) {
  var w = $('wrap'), p = $('ptr');
  w.className = 'wrap' + (anim ? ' ptr-anim' : '');
  var t = y > 0 ? 'translate3d(0,' + y + 'px,0)' : 'none';
  w.style.webkitTransform = t; w.style.transform = t;
  p.style.opacity = y > 0 ? String(Math.min(1, y / 50)) : '0';
}
function ptrSet(mode) {
  if (mode === ptrMode) return; ptrMode = mode;
  $('ptr').innerHTML = mode === 'busy' ? '<span class="ar spin">↻</span>Обновляем…'
    : '<span class="ar' + (mode === 'ready' ? ' up' : '') + '">↓</span>' + (mode === 'ready' ? 'Отпустите, чтобы обновить' : 'Потяните, чтобы обновить');
}
document.addEventListener('touchstart', function (e) {
  if (ptrBusy || menuOpen || $('main').className === 'hide' || $('card').className !== 'hide' || (window.pageYOffset || document.documentElement.scrollTop) > 0) { ptrY = null; return; }
  ptrY = e.touches[0].clientY; ptrD = 0;
}, false);
document.addEventListener('touchmove', function (e) {
  if (ptrY === null) return;
  ptrD = e.touches[0].clientY - ptrY;
  if (ptrD <= 0) { ptrMove(0); return; }
  // Свою пружину Safari выключаем, иначе она спорит с нашим сдвигом. Сопротивление растёт по мере оттягивания
  if (e.cancelable) e.preventDefault();
  var y = 120 * (1 - Math.exp(-ptrD / 200));
  ptrSet(y > 60 ? 'ready' : 'pull');
  ptrMove(y);
}, ptrOpt);
document.addEventListener('touchend', function () {
  if (ptrY === null) return;
  ptrY = null;
  if (ptrMode === 'ready') {
    ptrBusy = true; ptrSet('busy'); ptrMove(64, true); load();
    setTimeout(function () { ptrMove(0, true); setTimeout(function () { ptrBusy = false; ptrSet(''); $('wrap').className = 'wrap'; }, 300); }, 900);
  } else { ptrMove(0, true); setTimeout(function () { ptrSet(''); }, 300); }
}, false);
</script>
