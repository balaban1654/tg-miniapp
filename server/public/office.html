<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0817">
<title>Hunter Office</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
@font-face{font-family:'Montserrat';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Regular.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Medium.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-SemiBold.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-Bold.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Montserrat-ExtraBold.woff2') format('woff2')}
:root{--bg:#0d0817;--bg2:#150d26;--card:#1c1233;--card2:#251847;--line:#34255c;--fg:#f1ebff;--mut:#a89cc8;--acc:#9b5cff;--acc2:#c9a6ff;--acc3:#6a2fe0;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b8a;
--fd:'Montserrat',system-ui,sans-serif;--fb:'Montserrat',system-ui,sans-serif;--fm:'Montserrat',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-variant-numeric:tabular-nums;background:var(--bg);color:var(--fg);font:14px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:#a975ff}.btn.o{background:none;border:1px solid var(--acc);color:var(--acc2)}.btn.s{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.nav button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
label{display:grid;gap:5px;color:var(--mut);font-size:13px}
input,select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--bad);min-height:1.4em;font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
/* вход */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#login .card{width:min(380px,100%);display:grid;gap:14px;padding:24px;border-radius:18px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font:700 15px var(--fd)}
.hint{color:var(--mut);font-size:12px}
/* приложение */
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.side{background:#0a0613;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{padding:4px 10px 16px}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;white-space:nowrap;background:none;border:0;border-radius:9px;padding:9px 12px;color:var(--mut);font-weight:600;cursor:pointer}
.nav button.on{background:var(--card2);color:var(--fg)}
.me{margin-top:auto;padding:10px;color:var(--mut);font-size:12px;display:grid;gap:8px}
main{padding:22px clamp(14px,3vw,32px);display:grid;gap:18px;align-content:start;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.kpi b{display:block;font:700 24px var(--fm);margin-top:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:var(--bg2)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--fm);text-align:right}
th.n{text-align:right}
.cp{display:inline-flex;align-items:center;gap:8px}.cp button{background:none;border:0;padding:2px;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:6px}.cp button:hover{color:var(--fg);background:var(--card2)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font:600 11px var(--fm)}
.p-ok{background:#3ddc9722;color:var(--ok)}.p-warn{background:#ffb84d22;color:var(--warn)}.p-bad{background:#ff6b8a22;color:var(--bad)}.p-pur{background:#9b5cff33;color:var(--acc2)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end}
.empty{padding:28px;text-align:center;color:var(--mut)}
code{font-family:var(--fm);font-size:12px;color:var(--acc2)}
.top{display:none}
.chat-wrap{display:grid;grid-template-columns:300px 1fr;gap:12px;height:calc(100vh - 120px);min-height:420px}
.chat-list{overflow:auto;display:grid;gap:6px;align-content:start;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--bg2)}
.chat-item{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;color:inherit;min-width:0}
.chat-item.on{border-color:var(--acc);background:var(--card2)}
.chat-item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.sm{font-size:12px}
.bt{display:grid;grid-template-columns:1.2fr 1fr 1.4fr auto;gap:8px;align-items:center}
.pv{background:var(--card2);border-radius:12px;border-top-left-radius:3px;padding:10px 12px;max-width:340px;white-space:pre-wrap;overflow-wrap:anywhere}
.pv .k{display:grid;gap:4px;margin-top:8px}.pv .k span{background:#ffffff14;border-radius:8px;text-align:center;padding:6px;font-weight:600;font-size:12px;color:var(--acc2)}
textarea.big{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font:inherit;color:inherit;min-height:110px;resize:vertical}
.ok-msg{color:var(--ok)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(37,24,71,.96);border:1px solid var(--acc);box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 24px rgba(155,92,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:9px 26px;border-radius:14px;z-index:99;width:max-content;max-width:92%;text-align:center;font-weight:600;line-height:1.35;pointer-events:none;animation:toastIn .18s ease-out,toastOut .7s ease-in 1.3s forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes toastOut{0%{opacity:1}40%{opacity:.6}100%{opacity:0}}
.chat-thread{display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2);min-width:0}
.thread-head{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.msgs{overflow:auto;padding:14px;display:grid;gap:8px;align-content:start}
.bub{max-width:78%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.in{background:var(--card2);border-top-left-radius:3px}
.bub.out{background:var(--acc3);justify-self:end;border-top-right-radius:3px}
.bub small{display:block;color:#ffffffa0;font-size:11px;margin-top:2px}
.bub img{max-width:240px;border-radius:8px;display:block;margin-bottom:4px}
.reply{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.reply textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;font:inherit;color:inherit;min-height:44px;max-height:120px}
@media(max-width:760px){.chat-wrap{grid-template-columns:1fr;height:auto}.chat-list{max-height:220px}.chat-thread{height:60vh}}
@media(max-width:760px){
 #app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
 .side .brand{padding:0 8px 0 0}.nav{grid-auto-flow:column;overflow-x:auto}.me{margin:0 0 0 auto;display:flex;align-items:center}
}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand"><div class="logo">H</div><div><h1 style="font-size:18px">Hunter Office</h1><div class="hint">Кабинет команды Hunter AI</div></div></div>
    <label>Логин<input id="lLogin" name="username" autocomplete="username" required></label>
    <label>Пароль<input id="lPass" name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn" id="lBtn" type="submit">Войти</button>
    <p class="hint">Установи Office как приложение: на iPhone и iPad нажми «Поделиться» → «На экран Домой», на Android и в Chrome нажми «Установить».</p>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="logo">H</div><b style="font:700 14px var(--fd)">Hunter Office</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div id="meName"></div><button class="btn o s" id="logout" type="button">Выйти</button></div>
  </aside>
  <main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s);
const ROLE={admin:'Админ',teamlead:'Тимлидер',streamer:'Стример',buyer:'Медиабайер',analyst:'Аналитик'};
const STATUS={new:['Новый','p-pur'],registered:['Регистрация','p-warn'],ftd:['FTD','p-ok'],active:['Активный','p-ok'],churned:['Отвал','p-bad']};
let me=null,tab='home';

async function api(path,opts={}){
  const r=await fetch('/api/office'+path,{credentials:'same-origin',headers:{'content-type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):(opts.method&&opts.method!=='GET'?'{}':undefined)});
  const data=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='/login'){showLogin();throw new Error('auth')}
  if(!r.ok)throw new Error(data.error||'Ошибка '+r.status);
  return data;
}
function el(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null)e.setAttribute(k,v)}
  for(const k of kids.flat())if(k!==null&&k!==undefined)e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
const money=v=>'$'+Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const date=v=>new Date(v).toLocaleDateString('ru-RU',{timeZone:'Europe/Kyiv',day:'numeric',month:'short'});
const pill=(st)=>{const[t,c]=STATUS[st]||[st,'p-pur'];return el('span',{class:'pill '+c},t)};
function table(cols,rows,empty){
  if(!rows.length)return el('div',{class:'card empty'},empty);
  return el('div',{class:'tbl'},el('table',{},el('thead',{},el('tr',{},cols.map(c=>Array.isArray(c)?el('th',{class:c[1]},c[0]):el('th',{},c)))),el('tbody',{},rows.map(r=>el('tr',{},r.map(c=>c instanceof Node?c:el('td',{},c)))))));
}
const td=(v,cls)=>el('td',{class:cls||''},v);

function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const n=el('div',{class:'toast',role:'status'},t);document.body.append(n);setTimeout(()=>n.remove(),2050)}
function showLogin(){me=null;$('#app').hidden=true;$('#login').hidden=false;$('#lPass').value=''}
const ICONS={
  home:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  signals:'<path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/>',
  chats:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
  leads:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
  links:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>',
  push:'<path d="M6 16V11a6 6 0 1112 0v5l2 2H4z"/><path d="M10 21a2 2 0 004 0"/>',
  media:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  pb:'<path d="M4 12h5l2-6 3 12 2-6h4"/>'};
const icon=k=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width','18');s.setAttribute('height','18');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[k]||'';return s};
function showApp(){
  $('#login').hidden=true;$('#app').hidden=false;
  $('#meName').textContent=me.name+' · '+ROLE[me.role];
  const items=[['home','Дашборд'],['leads','Лиды'],['links','Ссылки']];
  if(me.role==='admin'||me.role==='teamlead')items.push(['staff',me.role==='admin'?'Люди':'Моя команда']);
  if(['admin','teamlead','streamer'].includes(me.role))items.splice(1,0,['chats','Чаты']);
  if(me.role==='admin')items.splice(1,0,['signals','Сигналы']);
  if(me.role==='analyst'){items.length=0;items.push(['signals','Сигналы']);if(tab!=='signals')tab='signals'}
  if(me.role==='admin')items.push(['push','Пуши'],['media','Медиа'],['pb','Постбеки']);
  const nav=$('#nav');nav.replaceChildren(...items.map(([k,t])=>el('button',{type:'button','data-t':k,class:k===tab?'on':'',onclick:()=>{tab=k;showApp();render()}},icon(k),el('span',{class:'lbl'},k==='chats'?chatsLabel:t))));
  render();updateBadge();
}

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#lErr').textContent='';$('#lBtn').disabled=true;
  try{await api('/login',{method:'POST',body:{login:$('#lLogin').value,password:$('#lPass').value}});me=await api('/me');showApp()}
  catch(x){$('#lErr').textContent=x.message}
  finally{$('#lBtn').disabled=false}
});
$('#logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST'})}catch{}showLogin()});

/** render({soft:true}) обновляет страницу на месте: без «Загрузка…» и с сохранением прокрутки, чтобы экран не дёргался */
async function render(opt){
  stopPoll();
  const soft=!!(opt&&opt.soft===true);
  const m=$('#main'),y=window.scrollY,mt=m.scrollTop;
  if(!soft)m.replaceChildren(el('div',{class:'mut'},'Загрузка…'));
  try{
    if(tab==='home')m.replaceChildren(...await viewHome());
    else if(tab==='leads')m.replaceChildren(...await viewLeads());
    else if(tab==='links')m.replaceChildren(...await viewLinks());
    else if(tab==='staff')m.replaceChildren(...await viewStaff());
    else if(tab==='chats')m.replaceChildren(...await viewChats());
    else if(tab==='signals')m.replaceChildren(...await viewSignals());
    else if(tab==='push')m.replaceChildren(...await viewPush());
    else if(tab==='media')m.replaceChildren(...await viewMedia());
    else if(tab==='pb')m.replaceChildren(...await viewPostbacks());
  }catch(x){if(x.message!=='auth')m.replaceChildren(el('div',{class:'err'},x.message))}
  if(soft){window.scrollTo(0,y);m.scrollTop=mt}
}

async function viewHome(){
  const s=await api('/stats');const b=s.byStatus;
  const k=(t,v)=>el('div',{class:'kpi'},el('small',{},t),el('b',{},String(v)));
  return[el('div',{class:'head'},el('h2',{style:'font-size:20px'},'Дашборд')),
    el('div',{class:'kpis'},k('Клики по ссылкам',s.clicks),k('Лиды',s.total),k('Регистрации',(b.registered||0)+(b.ftd||0)+(b.active||0)),k('FTD',(b.ftd||0)+(b.active||0)),k('Отвал',b.churned||0)),
    el('div',{class:'kpis'},k('Депозиты',money(s.deposits)),k('Выводы',money(s.withdrawals)),...(s.commission!==null?[k('Заработано (комиссия)',money(s.commission))]:[]))];
}

async function viewLeads(){
  const rows=await api('/leads');
  const showOwner=me.role==='admin'||me.role==='teamlead';
  const showComm=me.role==='admin';
  const cols=['Лид','Telegram ID','Pocket ID','Статус',...(me.role==='admin'?['Тест']:[]),...(showOwner?['Владелец']:[]),'Ссылка','Пришёл','Депозиты',...(showComm?['Комиссия']:[])];
  return[el('div',{class:'head'},el('h2',{style:'font-size:20px'},'Лиды'),el('span',{class:'mut'},rows.length+' всего')),
    table(cols,rows.map(r=>[td(r.username?'@'+r.username:(r.first_name||r.tg_id)),td(r.tg_id,'n'),r.is_tester?td('Тестовый аккаунт','n'):td(r.trader_id||'—','n'),el('td',{},pill(r.status)),...(me.role==='admin'?[el('td',{},el('button',{class:'btn s'+(r.is_tester?'':' o'),type:'button',title:'Открыть аккаунту доступ как у обычного клиента, без реальной регистрации',onclick:async()=>{await api('/leads/'+r.tg_id+'/tester',{method:'PATCH',body:{value:!r.is_tester}});render()}},r.is_tester?'Доступ выдан':'Выдать доступ'))]:[]),...(showOwner?[td(r.owner_name||'не закреплён')]:[]),td(r.link_slug||'—'),td(date(r.created_at)),td(money(r.deposits),'n'),...(showComm?[td(money(r.commission),'n')]:[])]),
      'Лидов пока нет. Они появятся, когда люди перейдут по вашим ссылкам и нажмут «Старт» в боте.')];
}

function goUrl(slug){return 'https://'+location.host.replace(/^crm\./,'go.')+'/s/'+slug}
async function viewLinks(){
  const [rows,staff,sources]=await Promise.all([api('/links'),(me.role==='admin'||me.role==='teamlead')?api('/staff'):Promise.resolve([]),api('/sources')]);
  const adm=me.role==='admin';
  const slug=el('input',{id:'nSlug',placeholder:'ivan-instagram',required:'',pattern:'[a-z0-9][a-z0-9_\\-]{1,39}',title:'a-z, 0-9, - и _'});
  const src=el('input',{id:'nSrc',placeholder:'Instagram'});
  const owner=el('select',{id:'nOwner'},el('option',{value:''},'Я сам'),...staff.filter(s=>s.id!==me.id&&['streamer','buyer'].includes(s.role)).map(s=>el('option',{value:s.id},s.name+' · '+ROLE[s.role])));
  const err=el('div',{class:'err',role:'alert'});
  const form=el('form',{class:'card form',onsubmit:async e=>{e.preventDefault();err.textContent='';
    try{await api('/links',{method:'POST',body:{slug:slug.value,source:src.value,owner_id:owner.value||undefined}});render()}catch(x){err.textContent=x.message}}},
    el('label',{},'Адрес ссылки',slug),el('label',{},'Источник',src),
    (me.role==='admin'||me.role==='teamlead')?el('label',{},'Владелец',owner):el('span'),
    el('button',{class:'btn',type:'submit'},'Создать'),err);
  const copyBtn=u=>{const b=el('button',{class:'btn o s',type:'button',onclick:async()=>{try{await navigator.clipboard.writeText(u);b.textContent='Скопировано'}catch{b.textContent='Выделите вручную'}setTimeout(()=>b.textContent='Копировать',1500)}},'Копировать');return b};
  const srcTable=table(['Источник','Ссылок','Клики','Старты','Регистрации','FTD','Депозиты',...(adm?['Комиссия']:[])],sources.map(x=>[td(x.source),td(x.links,'n'),td(x.clicks,'n'),td(x.starts,'n'),td(x.regs,'n'),td(x.ftds,'n'),td(money(x.deposits),'n'),...(adm?[td(money(x.commission),'n')]:[])]),'Данные по источникам появятся, когда придут первые лиды.');

const COPY_SVG='<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>';
const copyCell=v=>{
  if(v===undefined||v===null||v===''||v==='—')return td('—');
  const b=el('button',{type:'button',title:'Копировать','aria-label':'Копировать',onclick:async()=>{

    toast('Скопировано: '+v)}});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');['viewBox:0 0 24 24','width:15','height:15','fill:none','stroke:currentColor','stroke-width:2','stroke-linecap:round','stroke-linejoin:round'].forEach(a=>{const[k,...r]=a.split(':');svg.setAttribute(k,r.join(':'))});svg.innerHTML=COPY_SVG;b.append(svg);
  return el('td',{},el('span',{class:'cp'},String(v),b));
};
