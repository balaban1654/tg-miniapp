<script>
const $=s=>document.querySelector(s);
const ROLE={admin:'Админ',teamlead:'Тимлидер',streamer:'Стример',buyer:'Медиабайер',analyst:'Аналитик'};
const STATUS={new:['Новый','p-pur'],registered:['Регистрация','ev-reg'],ftd:['FTD','ev-ftd'],active:['Активный','ev-dep'],churned:['Отвал','p-bad']};
let me=null,tab='home';
/* Адрес страницы: у каждого раздела своя ссылка (#/leads, #/acc/review), при обновлении остаёмся на месте */
const STAFF_TABS=['team','links'];
const ACC_TABS=['sum','review','bonus','pay','exp','why','plan','form'];
function hashPath(){return '/'+tab+(tab==='acc'?'/'+accState.tab:tab==='plans'?'/'+plansState.tab:tab==='staff'?'/'+staffState.tab:'')}
function pushHash(){const h='#'+hashPath();if(location.hash!==h)history.pushState(null,'',h)}
function readHash(){const[,t,sub]=(location.hash||'').split('/');if(!t)return;tab=t;if(t==='acc'&&ACC_TABS.includes(sub))accState.tab=sub;if(t==='plans'&&PLANS_TABS.includes(sub))plansState.tab=sub;if(t==='staff'&&STAFF_TABS.includes(sub))staffState.tab=sub}
window.addEventListener('popstate',()=>{if(!me)return;readHash();showApp()});

async function api(path,opts={}){
  const r=await fetch('/api/office'+path,{credentials:'same-origin',headers:{'content-type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):(opts.method&&opts.method!=='GET'?'{}':undefined)});
  const data=await r.json().catch(()=>({}));
  if(r.status===401&&!path.startsWith('/login')){showLogin();throw new Error('auth')}
  if(r.status===403&&data.code==='totp_setup'&&me){me.totp=false;showApp();throw new Error(data.error)}
  if(!r.ok){const e=new Error(data.error||'Ошибка '+r.status);e.restart=data.restart;throw e}
  return data;
}
/* null, undefined и false в списке детей не превращаются в текст «null» (replaceChildren/append/prepend) */
for(const fn of ['replaceChildren','append','prepend']){const orig=Element.prototype[fn];Element.prototype[fn]=function(...a){return orig.apply(this,a.flat(Infinity).filter(x=>x!=null&&x!==false))}}
function el(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null)e.setAttribute(k,v)}
  for(const k of kids.flat())if(k!==null&&k!==undefined)e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
const money=v=>'$'+Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const date=v=>new Date(v).toLocaleDateString('ru-RU',{timeZone:'Europe/Kyiv',day:'numeric',month:'short'});
const pill=(st)=>{const[t,c]=STATUS[st]||[st,'p-pur'];return el('span',{class:'pill '+c},t)};
function table(cols,rows,empty){
  if(!rows.length)return el('div',{class:'card empty'},empty);
  return el('div',{class:'tbl'},el('table',{},el('thead',{},el('tr',{},cols.map(c=>Array.isArray(c)?el('th',{class:c[1]},c[0]):el('th',{},c)))),el('tbody',{},rows.map(r=>el('tr',{},r.map(c=>c instanceof Node?c:el('td',{},c)))))));
}
const td=(v,cls)=>el('td',{class:cls||''},v);

function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const n=el('div',{class:'toast',role:'status'},t);document.body.append(n);setTimeout(()=>n.remove(),2050)}
(function(){const r=document.getElementById('rain');if(!r||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<26;i++){const c=document.createElement('i');c.style.cssText='left:'+Math.random()*100+'%;height:'+(14+Math.random()*34)+'px;background:'+(Math.random()<.5?'#43b82f':'#ff3b1d')+';opacity:'+(.15+Math.random()*.3)+';animation-duration:'+(14+Math.random()*18)+'s;animation-delay:-'+Math.random()*30+'s';r.appendChild(c)}})();
function showLogin(){me=null;$('#app').hidden=true;$('#login').hidden=false;$('#lPass').value=''}
const ICONS={
  home:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  settings:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  signals:'<path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/>',
  chats:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
  leads:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
  links:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>',
  push:'<path d="M6 16V11a6 6 0 1112 0v5l2 2H4z"/><path d="M10 21a2 2 0 004 0"/>',
  media:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  pb:'<path d="M4 12h5l2-6 3 12 2-6h4"/>',
  shifts:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
  acc:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/>',
  plans:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  mytasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'};
const icon=k=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width','18');s.setAttribute('height','18');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[k]||'';return s};
function showApp(){
  if(me.totp===false&&['admin','teamlead'].includes(me.role)){$('#login').hidden=true;$('#app').hidden=true;twofaDialog(true);return}
  document.querySelectorAll('.tf-overlay').forEach(x=>x.remove());
  $('#login').hidden=true;$('#app').hidden=false;
  $('#meName').replaceChildren(me.name,el('span',{class:'mrole'},' · '+ROLE[me.role]));
  const gb=$('#meGear');if(gb&&!gb.firstChild){gb.append(svgIcon(GEAR,16));gb.onclick=()=>openStaffCard(null)}
  const nb=$('#meNav');if(nb){if(!nb.firstChild){nb.append(svgIcon('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/>',16));nb.onclick=openNavEditor}nb.hidden=me.role!=='admin'}
  const items=[['home','Дашборд'],['leads','Лиды'],];
  if(me.role==='admin'||me.role==='teamlead')items.push(['staff',me.role==='admin'?'Сотрудники':'Моя команда']);
  if(['admin','teamlead','streamer'].includes(me.role))items.splice(1,0,['chats','Чаты']);
  if(me.role==='admin')items.splice(1,0,['signals','Сигналы']);
  if(me.role==='analyst'){items.length=0;items.push(['signals','Сигналы']);if(tab!=='signals')tab='signals'}
  if(me.role==='admin')items.push(['push','Пуши'],['media','Медиа'],['pb','Постбеки']);
  if(me.role==='streamer')items.splice(items.length,0,['shifts','Смены и отчёты'],['mytasks','Мои задачи']);
  if(me.role==='admin'&&me.streams)items.splice(items.findIndex(x=>x[0]==='chats')+1,0,['shifts','Смены и отчёты']);
  if(me.role==='admin'){items.splice(items.findIndex(x=>x[0]==='push'),0,['acc','Бухгалтерия']);items.splice(1,0,['plans','Планы и задачи'])}
  if(tab==='links'&&me.role==='admin'){tab='staff';staffState.tab='links'}
  if(!items.some(x=>x[0]===tab)){tab=items[0][0];history.replaceState(null,'','#'+hashPath())}
  navItems=items;
  drawNav();
  render();updateBadge();
}

/* ---------- Боковое меню: свой порядок, папки и значки ---------- */
let navItems=[];
const ICON_EXTRA={
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  dollar:'<path d="M12 3v18M16 7.5C15 6.5 13.7 6 12 6c-2.2 0-4 1-4 2.8 0 4 8 2 8 6.2 0 1.8-1.8 2.9-4 2.9-1.8 0-3.2-.6-4.2-1.6"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/>',
  heart:'<path d="M12 20s-7-4.4-9-9.2C1.8 7.4 3.7 4.5 6.8 4.5c1.9 0 3.2 1 5.2 3 2-2 3.3-3 5.2-3 3.1 0 5 2.9 3.8 6.3-2 4.8-9 9.2-9 9.2z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
  bars:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'
};
const ICON_ALL={...ICONS,...ICON_EXTRA};
const ICON_NAMES=['home','star','folder','chats','leads','links','staff','acc','plans','mytasks','shifts','push','media','pb','signals','settings','bolt','flag','calendar','dollar','shield','heart','globe','tag','mail','bookmark','key','camera','bars'];
const iconNamed=n=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width','18');s.setAttribute('height','18');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML=ICON_ALL[n]||ICON_ALL.star;return s};
const cloneJ=o=>JSON.parse(JSON.stringify(o));
/** Стандартная раскладка: у админа четыре раздела спрятаны в папку «Настройки» */
function defaultLayout(items,role){
  const keys=items.map(x=>x[0]);
  if(role==='admin'){const G=['signals','staff','push','media'];
    return{v:1,nodes:[...keys.filter(k=>!G.includes(k)).map(k=>({t:'i',k})),{t:'f',id:'settings',title:'Настройки',icon:'settings',items:G.filter(k=>keys.includes(k)).map(k=>({k}))}]}}
  return{v:1,nodes:keys.map(k=>({t:'i',k}))};
}
/** Сохранённая раскладка, приведённая к доступным разделам: лишние убираем, новые добавляем в конец */
function reconcileLayout(lay,items,role){
  const keys=new Set(items.map(x=>x[0]));
  const base=lay&&Array.isArray(lay.nodes)?cloneJ(lay):defaultLayout(items,role);
  const seen=new Set();
  const nodes=[];
  for(const n of base.nodes){
    if(n.t==='i'){if(keys.has(n.k)&&!seen.has(n.k)){seen.add(n.k);nodes.push(n)}}
    else if(n.t==='f'){n.items=(n.items||[]).filter(x=>keys.has(x.k)&&!seen.has(x.k));n.items.forEach(x=>seen.add(x.k));nodes.push(n)}
  }
  for(const k of keys)if(!seen.has(k))nodes.push({t:'i',k});
  return{v:1,nodes};
}
function drawNav(){
  const nav=$('#nav');if(!nav||!me)return;

      const save=async()=>{
        if(!/^\d{5,15}$/.test(inp.value.trim())){toast('Telegram ID: только цифры');return}
        ok.disabled=true;
        try{const res=await api('/postbacks/bind',{method:'POST',body:{trader_id:trader,tg_id:inp.value.trim()}});toast('Привязано. Обработано записей: '+res.applied+(res.left?', не удалось: '+res.left:'')+'. Лид теперь в «Лидах»');render({soft:true})}

      rows.length?'Ничего не найдено. Измените фильтры.':'Постбеков пока нет. Когда партнёрка отправит первый, он появится здесь.'));
    // Итого по показанным записям: по каждому событию отдельно, а строка «Итого» внизу таблицы, когда выбрано одно событие
    const by2={};list.forEach(r=>{const o=by2[r.event]||(by2[r.event]={n:0,s:0});o.n++;o.s+=amt(r)});
    const ORDER=['reg','ftd','dep','comm','wd'];
    const types=ORDER.filter(k=>by2[k]&&k!=='reg');
    const usd=v=>'$'+v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
    totBox.replaceChildren(...ORDER.filter(k=>by2[k]).map(k=>el('span',{class:'pb-tot'},el('span',{class:'pill ev-'+k},k),k==='reg'?el('b',{},by2[k].n+' шт'):el('b',{},usd(by2[k].s)),k==='reg'?null:el('span',{class:'mut sm'},by2[k].n+' шт'))));
