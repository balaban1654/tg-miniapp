# Конфиг Nginx для hunterai.space. Деплой копирует его в /etc/nginx/sites-available/hunter

# Ссылки стримеров и постбеки идут в приложение
server {
  listen 443 ssl;
  server_name go.hunterai.space api.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Hunter Office: корень открывает страницу входа, /api/ идёт в приложение
server {
  listen 443 ssl;
  server_name crm.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location / {
    rewrite ^/$ /office break;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Mini App: страница /app и API /api/app
server {
  listen 443 ssl;
  server_name app.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  add_header X-Content-Type-Options nosniff always;
  location / {
    rewrite ^/$ /app break;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Корень домена: заглушка
server {
  listen 443 ssl;
  server_name hunterai.space www.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  add_header X-Content-Type-Options nosniff always;
  location = / {
    rewrite ^ /site break;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location = /terms {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location /fonts/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location / { return 302 https://hunterai.space/; }
}

server { listen 80 default_server; return 301 https://$host$request_uri; }
