# Конфиг Nginx для hunterai.space. Деплой копирует его в /etc/nginx/sites-available/hunter

# Постбеки и API идут в приложение (go.hunterai.space больше не используется)
server {
  listen 443 ssl;
  server_name api.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Прежние адреса go. и crm. больше не работают: ведут на заглушку, офис теперь hunterai.space/crm
server {
  listen 443 ssl;
  server_name go.hunterai.space crm.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  return 302 https://hunterai.space/;
}

# Mini App: страница /app и API /api/app
server {
  listen 443 ssl;
  server_name app.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  add_header X-Content-Type-Options nosniff always;
  location / {
    rewrite ^/$ /app break;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Корень домена: заглушка
server {
  listen 443 ssl;
  server_name hunterai.space www.hunterai.space;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 60m;
  location = / {
    rewrite ^ /site break;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  # Hunter Office: hunterai.space/crm
  location = /crm {
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /office-sw.js {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location = /office.webmanifest {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  # Mini App: hunterai.space/app
  location = /app {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /terms {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  # Проверка «жив ли сайт снаружи» для сторожа сервера: отдаёт {"ok":true}, если приложение и база отвечают
  location = /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location = /favicon.ico {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location ^~ /img/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  location ^~ /fonts/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
  }
  # Ссылки команды: hunterai.space/liza и hunterai.space/liza/<код>. Служебные адреса сюда не попадают
  location ~ "^/(?!(?:office|crm|app|api|health|site|terms|img|fonts|favicon|s|b)(?:/|$))[a-z0-9][a-z0-9_-]{1,39}(?:/[a-z0-9_-]{2,40})?$" {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / { return 302 https://hunterai.space/; }
}

server { listen 80 default_server; return 301 https://$host$request_uri; }
