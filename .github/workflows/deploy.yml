name: Deploy

on:
  push:
    branches: [main, claude/telegram-mini-app-funnel-nbqal3]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH_KEY в секретах GitHub записан неверно. Скопируйте ключ целиком заново."; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Копирование кода на сервер
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '.env' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/hunter/"

      - name: Обновление Nginx
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            cp /etc/nginx/sites-available/hunter /tmp/hunter.bak
            cp /opt/hunter/deploy/nginx-hunter.conf /etc/nginx/sites-available/hunter
            if nginx -t; then systemctl reload nginx; else cp /tmp/hunter.bak /etc/nginx/sites-available/hunter; echo "Конфиг Nginx с ошибкой, возвращён прежний"; exit 1; fi'

      - name: Резервные копии базы (скрипт и ежедневный запуск)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            install -m 755 /opt/hunter/deploy/backup.sh /usr/local/bin/hunter-backup
            printf "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n30 3 * * * root /usr/local/bin/hunter-backup >> /var/log/hunter-backup.log 2>&1\n" > /etc/cron.d/hunter-backup
            chmod 644 /etc/cron.d/hunter-backup'

      - name: Запуск приложения
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/hunter && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
